<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS-WEB-W02 库区管理</title>
  <style>
:root {
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.82);
      --surface-solid: #ffffff;
      --line: rgba(29,29,31,0.08);
      --text: #1d1d1f;
      --subtext: rgba(29,29,31,0.72);
      --muted: rgba(29,29,31,0.48);
      --accent: #00ab95;
      --accent-soft: rgba(0,171,149,0.10);
      --warn: #c77c11;
      --danger: #d92d20;
      --sidebar-width: 248px;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --shadow: 0 22px 54px rgba(0,0,0,0.055);
      --shadow-soft: 0 8px 24px rgba(0,0,0,0.035);
      --font-heading: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "ss01" on, "cv05" on;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.95), rgba(255,255,255,0) 36%),
        radial-gradient(circle at top right, rgba(0,171,149,0.10), rgba(0,171,149,0) 26%),
        linear-gradient(180deg, #fafafc 0%, #f5f5f7 100%);
      z-index: -1;
    }
    button, input, select { font: inherit; }
    .shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; background: rgba(255,255,255,0.80);
      backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--line);
      padding: 16px 12px 18px; overflow: auto;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 8px 10px 14px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 50%; background: #1d1d1f; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; box-shadow: var(--shadow-soft);
    }
    .brand-title { font-family: var(--font-heading); font-size: 18px; font-weight: 600; letter-spacing: -0.035em; }
    .brand-subtitle { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .menu-search { position: relative; margin: 4px 6px 14px; }
    .menu-search span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
    .menu-search input {
      width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.92); padding: 0 14px 0 34px; outline: none;
      font-size: 12px; font-weight: 500; letter-spacing: -0.01em; color: var(--subtext);
    }
    .menu-search input::placeholder { color: var(--muted); }
    .menu-search input:focus { border-color: rgba(0,171,149,0.28); box-shadow: 0 0 0 4px rgba(0,171,149,0.08); }
    .nav { display: grid; gap: 6px; }
    .nav-group { border-radius: 16px; background: transparent; }
    .nav-group.is-direct .nav-caret { display: none; }
    .nav-group-button {
      width: 100%; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 12px 14px; border-radius: 14px; cursor: pointer; color: var(--text);
    }
    .nav-group-button:hover { background: rgba(29,29,31,0.04); }
    .nav-group-button.active { color: var(--accent); }
    .nav-group-button.active-parent { background: transparent; box-shadow: none; }
    .nav-group-button.active-direct { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(0,171,149,0.08); }
    .nav-group-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .nav-icon {
      width: 24px; height: 24px; border-radius: 8px; background: rgba(29,29,31,0.05); color: rgba(29,29,31,0.62);
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: 0 0 auto;
      transition: background .18s ease, color .18s ease;
    }
    .nav-icon svg, .metric-icon svg, .mini-icon svg, .hero-badge svg {
      width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-group-button.active .nav-icon {
      background: rgba(0,171,149,0.10);
      color: var(--accent);
    }
    .nav-group-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .nav-group-meta { display: none; }
    .nav-caret { color: var(--muted); font-size: 12px; transition: transform .2s ease; }
    .nav-group.is-open .nav-caret { transform: rotate(180deg); }
    .nav-items { display: none; gap: 6px; padding: 6px 0 8px 16px; }
    .nav-group.is-open .nav-items { display: grid; }
    .nav-item {
      position: relative; border: 0; background: transparent; color: var(--subtext); border-radius: 12px; padding: 10px 12px 10px 16px;
      text-align: left; cursor: pointer; font-size: 13px; width: 100%;
    }
    .nav-item:hover { background: rgba(29,29,31,0.04); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(0,171,149,0.08); }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .header {
      position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 18px; padding: 16px 28px; background: rgba(245,245,247,0.82);
      backdrop-filter: saturate(180%) blur(24px); border-bottom: 1px solid var(--line);
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .breadcrumb { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .breadcrumb strong { color: var(--text); font-weight: 600; }
    .breadcrumb-home {
      color: var(--muted);
      cursor: pointer;
      transition: color .18s ease;
    }
    .breadcrumb-home:hover { color: var(--accent); }
    .search { position: relative; width: min(360px, 100%); flex: 1 1 auto; min-width: 220px; }
    .search span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
    .search input {
      width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.84); padding: 0 14px 0 36px; outline: none;
      font-size: 12px; font-weight: 500; letter-spacing: -0.01em; color: var(--subtext);
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { border-color: rgba(0,171,149,0.28); box-shadow: 0 0 0 4px rgba(0,171,149,0.08); }
    .chip, .select-chip, .icon-btn, .user-chip, .ghost-btn, .primary-btn {
      height: 44px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: rgba(255,255,255,0.92);
      display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text);
    }
    .chip { font-size: 13px; color: var(--subtext); }
    .chip strong { color: var(--text); font-weight: 600; }
    .select-chip { cursor: pointer; }
    .select-chip select {
      border: 0; background: transparent; color: var(--text); outline: none; appearance: none; cursor: pointer;
      font-size: 13px; font-weight: 600; padding-right: 12px;
    }
    .select-chip span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .select-chip::after { content: "▾"; color: var(--muted); margin-left: -10px; font-size: 11px; }
    .icon-btn { width: 40px; justify-content: center; padding: 0; cursor: pointer; }
    .user-chip { padding-left: 6px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; background: #1d1d1f; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .ghost-btn, .primary-btn {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ghost-btn:hover, .select-chip:hover { background: #ffffff; }
    .primary-btn { background: #1d1d1f; color: #fff; border-color: #1d1d1f; box-shadow: 0 8px 18px rgba(29,29,31,0.12); }
    .canvas {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 20px 20px 34px;
      box-sizing: border-box;
      display: grid;
      gap: 20px;
    }
    .page-stack { display: grid; gap: 14px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 0; flex-wrap: wrap; }
    .page-title { margin: 0; font-family: var(--font-heading); font-size: 28px; line-height: 1.12; letter-spacing: -0.045em; font-weight: 600; }
    .page-actions { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .hero {
      border-radius: var(--radius-xl); background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(251,251,253,0.88));
      border: 1px solid rgba(255,255,255,0.92); box-shadow: var(--shadow); padding: 34px 36px; display: grid; gap: 22px;
    }
    .hero h1 { margin: 0; font-family: var(--font-heading); font-size: clamp(30px, 3vw, 34px); line-height: 1.02; letter-spacing: -0.05em; font-weight: 600; }
    .hero p { margin: 0; max-width: 860px; color: var(--subtext); font-size: 16px; line-height: 1.7; }
    .hero-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .hero-badge {
      min-height: 34px;
      border-radius: 999px;
      padding: 0 12px;
      background: rgba(29,29,31,0.04);
      color: var(--subtext);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .section-card {
      padding: 26px; border-radius: var(--radius-lg); background: rgba(255,255,255,0.90);
      border: 1px solid rgba(255,255,255,0.92); box-shadow: var(--shadow-soft);
    }
    .section-card.compact { padding: 20px 22px; }
    .section-card.compact .section-head { margin-bottom: 12px; align-items: center; }
    .section-card.compact .section-title { font-size: 20px; letter-spacing: -0.03em; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .section-title { margin: 0; font-family: var(--font-heading); font-size: 24px; font-weight: 600; letter-spacing: -0.04em; }
    .section-desc { margin: 6px 0 0; color: var(--subtext); font-size: 14px; line-height: 1.65; }
    .metrics, .quick-grid, .placeholder-grid, .mini-grid { display: grid; gap: 16px; }
    .metrics { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .mini-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .mini-grid.is-four { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .mini-grid.is-five { grid-template-columns: repeat(5, minmax(0,1fr)); }
    .stats-area {
      display: grid;
      gap: 6px;
      margin-top: -4px;
    }
    .stats-collapse {
      height: 0;
      overflow: hidden;
      transition: height 220ms ease;
      will-change: height;
    }
    .stats-toggle-wrap {
      display: flex;
      justify-content: center;
      padding-top: 2px;
    }
    .stats-toggle {
      height: 18px;
      padding: 0 10px;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid rgba(29,29,31,0.10);
      background: rgba(255,255,255,0.92);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    }
    .stats-label {
      font-size: 11px;
      font-weight: 650;
      color: rgba(29,29,31,0.55);
      line-height: 1;
      white-space: nowrap;
    }
    .stats-chevron {
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(29,29,31,0.62);
      border-bottom: 2px solid rgba(29,29,31,0.62);
      transform: rotate(45deg);
      transition: transform 220ms ease;
    }
    .stats-toggle[aria-expanded="true"] .stats-chevron {
      transform: rotate(-135deg);
    }
    .metric, .mini-card {
      padding: 22px; border-radius: 24px; background: linear-gradient(180deg, #ffffff 0%, #fcfcfd 100%); border: 1px solid rgba(29,29,31,0.05); box-shadow: 0 12px 28px rgba(0,0,0,0.03);
      position: relative;
      overflow: hidden;
    }
    .metric-clickable {
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .metric-clickable:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.05);
      border-color: rgba(0,171,149,0.16);
    }
    .mini-card.compact { padding: 16px 16px 14px; border-radius: 20px; }
    .mini-card.compact .mini-icon { width: 30px; height: 30px; border-radius: 10px; }
    .mini-card.compact .mini-value { margin-top: 12px; font-size: 24px; }
    .mini-card.compact .mini-note { margin-top: 8px; font-size: 12px; }
    .metric::before, .mini-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, rgba(0,171,149,0.55), rgba(0,171,149,0));
    }
    .metric-top, .mini-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--subtext); font-size: 13px; }
    .metric-icon, .mini-icon {
      width: 34px; height: 34px; border-radius: 12px; background: rgba(29,29,31,0.05); color: rgba(29,29,31,0.56); display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .metric-value, .mini-value { margin-top: 18px; font-family: var(--font-heading); font-size: 42px; line-height: 0.96; letter-spacing: -0.06em; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mini-value { font-size: 28px; }
    .metric-note, .mini-note { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(340px,0.9fr); gap: 18px; }
    .cockpit-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, 0.95fr); gap: 18px; }
    .cockpit-side { display: grid; gap: 18px; }
    .cockpit-metric.warning::before { background: linear-gradient(90deg, rgba(199,124,17,0.7), rgba(199,124,17,0)); }
    .cockpit-metric.danger::before { background: linear-gradient(90deg, rgba(217,45,32,0.72), rgba(217,45,32,0)); }
    .cockpit-metric.success::before { background: linear-gradient(90deg, rgba(0,171,149,0.7), rgba(0,171,149,0)); }
    .quick-entry-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .quick-entry {
      min-height: 54px;
      border-radius: 18px;
      border: 1px solid rgba(29,29,31,0.06);
      background: rgba(255,255,255,0.72);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
    }
    .quick-entry-main { display: grid; gap: 4px; min-width: 0; }
    .quick-entry-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .quick-entry-note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-entry .mini-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      flex: 0 0 auto;
    }
    .metric-kicker {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .funnel-list, .risk-list, .todo-list { display: grid; gap: 12px; }
    .funnel-item.is-key {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px 14px;
    }
    .funnel-item.is-key .progress {
      grid-column: 1 / -1;
    }
    .funnel-item.is-key .funnel-meta {
      grid-column: 1 / -1;
    }
    .list-scroll {
      overflow: auto;
      padding-right: 2px;
    }
    .list-scroll.compact {
      max-height: 238px;
    }
    .pagination-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(29,29,31,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .pagination-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .page-btn {
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(29,29,31,0.08);
      background: rgba(255,255,255,0.96);
      color: var(--subtext);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-btn.active {
      background: rgba(0,171,149,0.1);
      color: var(--accent);
      border-color: rgba(0,171,149,0.18);
    }
    .inline-link {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .funnel-item, .risk-item, .todo-item {
      border-radius: 18px;
      border: 1px solid rgba(29,29,31,0.06);
      background: rgba(250,250,252,0.88);
      padding: 16px 18px;
    }
    .funnel-item { display: grid; gap: 8px; }
    .funnel-head, .risk-head, .todo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .funnel-title-group {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .funnel-label, .risk-title, .todo-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .funnel-value, .risk-value {
      font-family: var(--font-heading);
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 600;
      color: var(--text);
    }
    .funnel-meta, .risk-meta, .todo-meta, .todo-owner {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .funnel-breakdown {
      color: var(--subtext);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 600;
    }
    .funnel-group {
      display: grid;
      gap: 10px;
    }
    .funnel-group + .funnel-group {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed rgba(29,29,31,0.08);
    }
    .funnel-group-title {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      color: var(--subtext);
      letter-spacing: 0.01em;
    }
    .cockpit-funnel-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .title-with-tip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .title-tip {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(29,29,31,0.12);
      background: #fff;
      color: var(--subtext);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      cursor: help;
      user-select: none;
    }
    .title-tip-bubble {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 360px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(29,29,31,0.08);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      display: grid;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
      z-index: 20;
    }
    .title-tip-bubble::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 18px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-left: 1px solid rgba(29,29,31,0.08);
      border-top: 1px solid rgba(29,29,31,0.08);
      transform: rotate(45deg);
    }
    .title-with-tip:hover .title-tip-bubble,
    .title-with-tip:focus-within .title-tip-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
