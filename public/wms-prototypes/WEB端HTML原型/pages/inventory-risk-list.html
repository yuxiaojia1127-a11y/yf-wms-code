<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS-WEB-015A 库存风险列表</title>
  <style>
:root {
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.82);
      --surface-solid: #ffffff;
      --line: rgba(29,29,31,0.08);
      --text: #1d1d1f;
      --subtext: rgba(29,29,31,0.72);
      --muted: rgba(29,29,31,0.48);
      --accent: #00ab95;
      --accent-soft: rgba(0,171,149,0.10);
      --warn: #c77c11;
      --danger: #d92d20;
      --sidebar-width: 248px;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --shadow: 0 22px 54px rgba(0,0,0,0.055);
      --shadow-soft: 0 8px 24px rgba(0,0,0,0.035);
      --font-heading: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "ss01" on, "cv05" on;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.95), rgba(255,255,255,0) 36%),
        radial-gradient(circle at top right, rgba(0,171,149,0.10), rgba(0,171,149,0) 26%),
        linear-gradient(180deg, #fafafc 0%, #f5f5f7 100%);
      z-index: -1;
    }
    button, input, select { font: inherit; }
    .shell { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; background: rgba(255,255,255,0.80);
      backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--line);
      padding: 16px 12px 18px; overflow: auto;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 8px 10px 14px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 50%; background: #1d1d1f; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; box-shadow: var(--shadow-soft);
    }
    .brand-title { font-family: var(--font-heading); font-size: 18px; font-weight: 600; letter-spacing: -0.035em; }
    .brand-subtitle { margin-top: 2px; font-size: 12px; color: var(--muted); }
    .menu-search { position: relative; margin: 4px 6px 14px; }
    .menu-search span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
    .menu-search input {
      width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.92); padding: 0 14px 0 34px; outline: none;
      font-size: 12px; font-weight: 500; letter-spacing: -0.01em; color: var(--subtext);
    }
    .menu-search input::placeholder { color: var(--muted); }
    .menu-search input:focus { border-color: rgba(0,171,149,0.28); box-shadow: 0 0 0 4px rgba(0,171,149,0.08); }
    .nav { display: grid; gap: 6px; }
    .nav-group { border-radius: 16px; background: transparent; }
    .nav-group.is-direct .nav-caret { display: none; }
    .nav-group-button {
      width: 100%; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 12px 14px; border-radius: 14px; cursor: pointer; color: var(--text);
    }
    .nav-group-button:hover { background: rgba(29,29,31,0.04); }
    .nav-group-button.active { color: var(--accent); }
    .nav-group-button.active-parent { background: transparent; box-shadow: none; }
    .nav-group-button.active-direct { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(0,171,149,0.08); }
    .nav-group-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .nav-icon {
      width: 24px; height: 24px; border-radius: 8px; background: rgba(29,29,31,0.05); color: rgba(29,29,31,0.62);
      display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: 0 0 auto;
      transition: background .18s ease, color .18s ease;
    }
    .nav-icon svg, .metric-icon svg, .mini-icon svg, .hero-badge svg {
      width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-group-button.active .nav-icon {
      background: rgba(0,171,149,0.10);
      color: var(--accent);
    }
    .nav-group-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .nav-group-meta { display: none; }
    .nav-caret { color: var(--muted); font-size: 12px; transition: transform .2s ease; }
    .nav-group.is-open .nav-caret { transform: rotate(180deg); }
    .nav-items { display: none; gap: 6px; padding: 6px 0 8px 16px; }
    .nav-group.is-open .nav-items { display: grid; }
    .nav-item {
      position: relative; border: 0; background: transparent; color: var(--subtext); border-radius: 12px; padding: 10px 12px 10px 16px;
      text-align: left; cursor: pointer; font-size: 13px; width: 100%;
    }
    .nav-item:hover { background: rgba(29,29,31,0.04); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(0,171,149,0.08); }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .header {
      position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 18px; padding: 16px 28px; background: rgba(245,245,247,0.82);
      backdrop-filter: saturate(180%) blur(24px); border-bottom: 1px solid var(--line);
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .breadcrumb { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .breadcrumb strong { color: var(--text); font-weight: 600; }
    .breadcrumb-home {
      color: var(--muted);
      cursor: pointer;
      transition: color .18s ease;
    }
    .breadcrumb-home:hover { color: var(--accent); }
    .search { position: relative; width: min(360px, 100%); flex: 1 1 auto; min-width: 220px; }
    .search span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
    .search input {
      width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.84); padding: 0 14px 0 36px; outline: none;
      font-size: 12px; font-weight: 500; letter-spacing: -0.01em; color: var(--subtext);
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { border-color: rgba(0,171,149,0.28); box-shadow: 0 0 0 4px rgba(0,171,149,0.08); }
    .chip, .select-chip, .icon-btn, .user-chip, .ghost-btn, .primary-btn {
      height: 44px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: rgba(255,255,255,0.92);
      display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text);
    }
    .chip { font-size: 13px; color: var(--subtext); }
    .chip strong { color: var(--text); font-weight: 600; }
    .select-chip { cursor: pointer; }
    .select-chip select {
      border: 0; background: transparent; color: var(--text); outline: none; appearance: none; cursor: pointer;
      font-size: 13px; font-weight: 600; padding-right: 12px;
    }
    .select-chip span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .select-chip::after { content: "▾"; color: var(--muted); margin-left: -10px; font-size: 11px; }
    .icon-btn { width: 40px; justify-content: center; padding: 0; cursor: pointer; }
    .user-chip { padding-left: 6px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; background: #1d1d1f; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .ghost-btn, .primary-btn {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ghost-btn:hover, .select-chip:hover { background: #ffffff; }
    .primary-btn { background: #1d1d1f; color: #fff; border-color: #1d1d1f; box-shadow: 0 8px 18px rgba(29,29,31,0.12); }
    .canvas {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 20px 20px 34px;
      box-sizing: border-box;
      display: grid;
      gap: 20px;
    }
    .page-stack { display: grid; gap: 14px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-width: 0; flex-wrap: wrap; }
    .page-title { margin: 0; font-family: var(--font-heading); font-size: 28px; line-height: 1.12; letter-spacing: -0.045em; font-weight: 600; }
    .page-actions { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .hero {
      border-radius: var(--radius-xl); background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(251,251,253,0.88));
      border: 1px solid rgba(255,255,255,0.92); box-shadow: var(--shadow); padding: 34px 36px; display: grid; gap: 22px;
    }
    .hero h1 { margin: 0; font-family: var(--font-heading); font-size: clamp(30px, 3vw, 34px); line-height: 1.02; letter-spacing: -0.05em; font-weight: 600; }
    .hero p { margin: 0; max-width: 860px; color: var(--subtext); font-size: 16px; line-height: 1.7; }
    .hero-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .hero-badge {
      min-height: 34px;
      border-radius: 999px;
      padding: 0 12px;
      background: rgba(29,29,31,0.04);
      color: var(--subtext);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .section-card {
      padding: 26px; border-radius: var(--radius-lg); background: rgba(255,255,255,0.90);
      border: 1px solid rgba(255,255,255,0.92); box-shadow: var(--shadow-soft);
    }
    .section-card.compact { padding: 20px 22px; }
    .section-card.compact .section-head { margin-bottom: 12px; align-items: center; }
    .section-card.compact .section-title { font-size: 20px; letter-spacing: -0.03em; }
    .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .section-title { margin: 0; font-family: var(--font-heading); font-size: 24px; font-weight: 600; letter-spacing: -0.04em; }
    .section-desc { margin: 6px 0 0; color: var(--subtext); font-size: 14px; line-height: 1.65; }
    .metrics, .quick-grid, .placeholder-grid, .mini-grid { display: grid; gap: 16px; }
    .metrics { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .mini-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .mini-grid.is-four { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .mini-grid.is-five { grid-template-columns: repeat(5, minmax(0,1fr)); }
    .stats-area {
      display: grid;
      gap: 6px;
      margin-top: -4px;
    }
    .stats-collapse {
      height: 0;
      overflow: hidden;
      transition: height 220ms ease;
      will-change: height;
    }
    .stats-toggle-wrap {
      display: flex;
      justify-content: center;
      padding-top: 2px;
    }
    .stats-toggle {
      height: 18px;
      padding: 0 10px;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid rgba(29,29,31,0.10);
      background: rgba(255,255,255,0.92);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    }
    .stats-label {
      font-size: 11px;
      font-weight: 650;
      color: rgba(29,29,31,0.55);
      line-height: 1;
      white-space: nowrap;
    }
    .stats-chevron {
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(29,29,31,0.62);
      border-bottom: 2px solid rgba(29,29,31,0.62);
      transform: rotate(45deg);
      transition: transform 220ms ease;
    }
    .stats-toggle[aria-expanded="true"] .stats-chevron {
      transform: rotate(-135deg);
    }
    .metric, .mini-card {
      padding: 22px; border-radius: 24px; background: linear-gradient(180deg, #ffffff 0%, #fcfcfd 100%); border: 1px solid rgba(29,29,31,0.05); box-shadow: 0 12px 28px rgba(0,0,0,0.03);
      position: relative;
      overflow: hidden;
    }
    .metric-clickable {
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .metric-clickable:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.05);
      border-color: rgba(0,171,149,0.16);
    }
    .mini-card.compact { padding: 16px 16px 14px; border-radius: 20px; }
    .mini-card.compact .mini-icon { width: 30px; height: 30px; border-radius: 10px; }
    .mini-card.compact .mini-value { margin-top: 12px; font-size: 24px; }
    .mini-card.compact .mini-note { margin-top: 8px; font-size: 12px; }
    .metric::before, .mini-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, rgba(0,171,149,0.55), rgba(0,171,149,0));
    }
    .metric-top, .mini-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--subtext); font-size: 13px; }
    .metric-icon, .mini-icon {
      width: 34px; height: 34px; border-radius: 12px; background: rgba(29,29,31,0.05); color: rgba(29,29,31,0.56); display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .metric-value, .mini-value { margin-top: 18px; font-family: var(--font-heading); font-size: 42px; line-height: 0.96; letter-spacing: -0.06em; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mini-value { font-size: 28px; }
    .metric-note, .mini-note { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(340px,0.9fr); gap: 18px; }
    .cockpit-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, 0.95fr); gap: 18px; }
    .cockpit-side { display: grid; gap: 18px; }
    .cockpit-metric.warning::before { background: linear-gradient(90deg, rgba(199,124,17,0.7), rgba(199,124,17,0)); }
    .cockpit-metric.danger::before { background: linear-gradient(90deg, rgba(217,45,32,0.72), rgba(217,45,32,0)); }
    .cockpit-metric.success::before { background: linear-gradient(90deg, rgba(0,171,149,0.7), rgba(0,171,149,0)); }
    .quick-entry-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .quick-entry {
      min-height: 54px;
      border-radius: 18px;
      border: 1px solid rgba(29,29,31,0.06);
      background: rgba(255,255,255,0.72);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
    }
    .quick-entry-main { display: grid; gap: 4px; min-width: 0; }
    .quick-entry-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .quick-entry-note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-entry .mini-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      flex: 0 0 auto;
    }
    .metric-kicker {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .funnel-list, .risk-list, .todo-list { display: grid; gap: 12px; }
    .funnel-item.is-key {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px 14px;
    }
    .funnel-item.is-key .progress {
      grid-column: 1 / -1;
    }
    .funnel-item.is-key .funnel-meta {
      grid-column: 1 / -1;
    }
    .list-scroll {
      overflow: auto;
      padding-right: 2px;
    }
    .list-scroll.compact {
      max-height: 238px;
    }
    .pagination-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(29,29,31,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .pagination-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .page-btn {
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(29,29,31,0.08);
      background: rgba(255,255,255,0.96);
      color: var(--subtext);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-btn.active {
      background: rgba(0,171,149,0.1);
      color: var(--accent);
      border-color: rgba(0,171,149,0.18);
    }
    .inline-link {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .funnel-item, .risk-item, .todo-item {
      border-radius: 18px;
      border: 1px solid rgba(29,29,31,0.06);
      background: rgba(250,250,252,0.88);
      padding: 16px 18px;
    }
    .funnel-item { display: grid; gap: 8px; }
    .funnel-head, .risk-head, .todo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .funnel-title-group {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .funnel-label, .risk-title, .todo-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .funnel-value, .risk-value {
      font-family: var(--font-heading);
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 600;
      color: var(--text);
    }
    .funnel-meta, .risk-meta, .todo-meta, .todo-owner {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .funnel-breakdown {
      color: var(--subtext);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 600;
    }
    .funnel-group {
      display: grid;
      gap: 10px;
    }
    .funnel-group + .funnel-group {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed rgba(29,29,31,0.08);
    }
    .funnel-group-title {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      color: var(--subtext);
      letter-spacing: 0.01em;
    }
    .cockpit-funnel-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .title-with-tip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .title-tip {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(29,29,31,0.12);
      background: #fff;
      color: var(--subtext);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      cursor: help;
      user-select: none;
    }
    .title-tip-bubble {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 360px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(29,29,31,0.08);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      display: grid;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
      z-index: 20;
    }
    .title-tip-bubble::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 18px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-left: 1px solid rgba(29,29,31,0.08);
      border-top: 1px solid rgba(29,29,31,0.08);
      transform: rotate(45deg);
    }
    .title-with-tip:hover .title-tip-bubble,
    .title-with-tip:focus-within .title-tip-bubble {
      opacity: 1;
      visibility: visible;

    async function loadExternalRequirementDoc(key = getRequirementDocKey(), force = false) {
      if (!key || !isExternalRequirementDoc(key)) return null;
      const state = getRequirementExternalState(key);
      if (!state) return null;
      if (state.status === 'loading') return state;
      if (!force && state.status === 'loaded' && state.content) return state;
      const requestUrl = `${requirementExternalSources[key]}?v=${Date.now()}`;
      state.status = 'loading';
      state.error = '';
      renderOverlay();
      try {
        const response = await fetch(requestUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`读取失败（${response.status}）`);
        }
        state.content = await response.text();
        state.status = 'loaded';
        state.error = '';
      } catch (error) {
        state.status = 'error';
        state.error = error.message || '读取外部需求文档失败';
      }
      renderOverlay();
      return state;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatMarkdownInline(text) {
      return escapeHtml(text || '')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    function renderMarkdownTable(lines) {
      if (lines.length < 2) return '';
      const parseRow = (line) => line.trim().replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim());
      const headers = parseRow(lines[0]);
      const rows = lines.slice(2).map(parseRow);
      return `
        <table>
          <thead><tr>${headers.map((cell) => `<th>${formatMarkdownInline(cell)}</th>`).join('')}</tr></thead>
          <tbody>${rows.map((row) => `<tr>${headers.map((_, idx) => `<td>${formatMarkdownInline(row[idx] || '')}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      `;
    }

    function renderMarkdownDocument(markdown) {
      const source = String(markdown || '').replace(/\r\n/g, '\n').trim();
      if (!source) {
        return '<div class="req-md-empty">当前外部 md 文档暂无内容</div>';
      }
      const lines = source.split('\n');
      const html = [];
      let index = 0;

      while (index < lines.length) {
        const rawLine = lines[index];
        const line = rawLine.trim();
        if (!line) {
          index += 1;
          continue;
        }
        if (line.startsWith('```')) {
          const codeLines = [];
          index += 1;
          while (index < lines.length && !lines[index].trim().startsWith('```')) {
            codeLines.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
          continue;
        }
        if (/^#{1,4}\s+/.test(line)) {
          const level = line.match(/^#+/)[0].length;
          html.push(`<h${level}>${formatMarkdownInline(line.replace(/^#{1,4}\s+/, ''))}</h${level}>`);
          index += 1;
          continue;
        }
        const isTableHeader = line.includes('|')
          && index + 1 < lines.length
          && /^\s*\|?[\-:\s|]+\|?\s*$/.test(lines[index + 1]);
        if (isTableHeader) {
          const tableLines = [rawLine, lines[index + 1]];
          index += 2;
          while (index < lines.length && lines[index].trim() && lines[index].includes('|')) {
            tableLines.push(lines[index]);
            index += 1;
          }
          html.push(renderMarkdownTable(tableLines));
          continue;
        }
        if (/^[-*]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^[-*]\s+/.test(lines[index].trim())) {
            items.push(lines[index].trim().replace(/^[-*]\s+/, ''));
            index += 1;
          }
          html.push(`<ul>${items.map((item) => `<li>${formatMarkdownInline(item)}</li>`).join('')}</ul>`);
          continue;
        }
        if (/^\d+\.\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\d+\.\s+/.test(lines[index].trim())) {
            items.push(lines[index].trim().replace(/^\d+\.\s+/, ''));
            index += 1;
          }
          html.push(`<ol>${items.map((item) => `<li>${formatMarkdownInline(item)}</li>`).join('')}</ol>`);
          continue;
        }
        const paragraph = [line];
        index += 1;
        while (index < lines.length) {
          const nextLine = lines[index].trim();
          if (!nextLine || /^#{1,4}\s+/.test(nextLine) || /^[-*]\s+/.test(nextLine) || /^\d+\.\s+/.test(nextLine)) break;
          const nextIsTableHeader = nextLine.includes('|')
            && index + 1 < lines.length
            && /^\s*\|?[\-:\s|]+\|?\s*$/.test(lines[index + 1]);
          if (nextIsTableHeader || nextLine.startsWith('```')) break;
          paragraph.push(nextLine);
          index += 1;
        }
        html.push(`<p>${formatMarkdownInline(paragraph.join('<br/>'))}</p>`);
      }
      return `<div class="req-md-article">${html.join('')}</div>`;
    }

    function getCockpitSnapshot() {
      return cockpitSnapshots[warehouseName()] || cockpitSnapshots['全部仓库'];
    }

    function parseNumericValue(value) {
      if (typeof value === 'number') return value;
      const normalized = String(value || '').replace(/,/g, '');
      const matched = normalized.match(/-?\d+(?:\.\d+)?/);
      return matched ? Number(matched[0]) : 0;
    }

    function getOverdueCount(item) {
      if (typeof item.overdue === 'number') return item.overdue;
      const matched = String(item.meta || '').match(/(\d+)\s*单超时处理/);
      return matched ? Number(matched[1]) : 0;
    }

    function getTodoWaitMinutes(item) {
      if (typeof item.waitMinutes === 'number') return item.waitMinutes;
      const matched = String(item.meta || '').match(/已等待\s*(\d+)\s*分钟/);
      return matched ? Number(matched[1]) : 0;
    }

    function getUrgentTodoWarehouse(item) {
      const matched = String(item.meta || '').match(/([0-9]+号仓库)/);
      return matched ? matched[1] : warehouseName();
    }

    function getUrgentTodoPriority(item) {
      return item.level === 'danger' || getTodoWaitMinutes(item) > 60 ? '紧急' : '预警';
    }

    function getUrgentTodoStatus(item) {
      return getTodoWaitMinutes(item) > 60 ? '已超时' : '待处理';
    }

    function getUrgentTodoSuggestion(item) {
      if (item.target === 'inbound') return '进入入库管理，确认收货或处理收货异常。';
      if (item.target === 'shipment') return '进入发货履约，优先处理待发运交接。';
      if (item.target === 'shipment-track') return '进入履约执行跟踪，定位卡点并推进处理。';
      if (item.target === 'warehouse-operation-track-list') return '进入仓内作业跟踪，定位节点卡点并推进处理。';
      if (item.target === 'fulfillment-link-track-list') return '进入履约链路跟踪，跟进接单与派单进度。';
      if (item.target === 'exception-job') return '进入异常与工单，补充处理记录并完成闭环。';
      return '进入对应业务页面继续处理。';
    }

    function getUrgentTodoRows() {
      const snapshot = getCockpitSnapshot();
      const excludedTodoTypes = new Set(['待复核', '异常待关闭', '工单待关闭']);
      return [...snapshot.todos, ...cockpitTodoFillers]
        .filter((item) => !excludedTodoTypes.has(item.type))
        .sort((a, b) => getTodoWaitMinutes(b) - getTodoWaitMinutes(a))
        .slice(0, 10)
        .map((item, index) => ({
          ...item,
          rowId: `${item.title}-${item.type}-${index}`,
          warehouse: getUrgentTodoWarehouse(item),
          waitMinutes: getTodoWaitMinutes(item),
          priority: getUrgentTodoPriority(item),
          statusText: getUrgentTodoStatus(item),
          updatedAt: snapshot.updateTime
        }));
    }

    function getUrgentTodoByRowId(rowId) {
      return getUrgentTodoRows().find((row) => row.rowId === rowId) || null;
    }

    function getRiskWarehouse(item) {
      const stockMatched = String(item.stock || '').match(/([0-9]+号仓库)/);
      if (stockMatched) return stockMatched[1];
      const metaMatched = String(item.meta || '').match(/([0-9]+号仓库)/);
      return metaMatched ? metaMatched[1] : warehouseName();
    }

    function getRiskType(item) {
      const meta = String(item.meta || '');
      if (item.value === '高锁定占比') {
        return item.level === 'danger' ? '严重高锁定' : '高锁定占比';
      }
      if (meta.includes('高预警库存')) return '高预警库存';
      if (meta.includes('安全库存')) return '安全库存预警';
      return item.value || '其他预警';
    }

    function getRiskLevelText(item) {
      return item.level === 'danger' ? '红色严重' : '橙色预警';
    }

    function getRiskAvailableText(item) {
      const matched = String(item.stock || '').match(/可售\s*([0-9]+\s*\S+)/);
      return matched ? matched[1].trim() : '--';
    }

    function getRiskLockRateText(item) {
      const matched = String(item.meta || '').match(/锁定占比\s*([0-9]+%)/);
      return matched ? matched[1] : '--';
    }

    function getRiskHighThresholdText(item) {
      const matched = String(item.meta || '').match(/高预警库存（([^）]+)）/);
      return matched ? matched[1] : '--';
    }

    function getRiskSafeThresholdText(item) {
      const matched = String(item.meta || '').match(/安全库存（([^）]+)）/);
      return matched ? matched[1] : '--';
    }

    function getRiskStatusText(item) {
      return item.level === 'danger' ? '待优先处理' : '跟进中';
    }

    function getRiskSuggestion(item) {
      const type = getRiskType(item);
      if (type === '高预警库存') return '建议优先补货或调整履约分配，避免继续跌破高预警库存阈值。';
      if (type === '安全库存预警') return '建议关注补货节奏和销量变化，避免进一步跌破高预警库存阈值。';
      if (type === '严重高锁定' || type === '高锁定占比') return '建议核查锁定来源、释放异常锁定，并确认是否存在未闭环履约或冻结占用。';
      return '建议进入库存控制页继续排查风险原因。';
    }

    function getInventoryRiskDefaultSortOrder(field) {
      if (field === 'warehouse' || field === 'riskType') return 'asc';
      return 'desc';
    }

    function getRiskTypeSortRank(riskType) {
      if (riskType === '高预警库存') return 0;
      if (riskType === '严重高锁定') return 1;
      if (riskType === '高锁定占比') return 2;
      if (riskType === '安全库存预警') return 3;
      return 9;
    }

    function getInventoryRiskSortValue(row, field) {
      if (field === 'riskType') return getRiskTypeSortRank(row.riskType);
      if (field === 'warehouse') return parseNumericValue(row.warehouse);
      if (field === 'availableText') return parseNumericValue(row.availableText);
      if (field === 'lockRateText') return parseNumericValue(row.lockRateText);
      if (field === 'updatedAt') return new Date(String(row.updatedAt).replace(/-/g, '/')).getTime() || 0;
      return '';
    }

    function compareInventoryRiskRows(left, right) {
      if (inventoryRiskSort.field === 'priority') return compareRiskItems(left, right);
      const direction = inventoryRiskSort.order === 'asc' ? 1 : -1;
      const leftValue = getInventoryRiskSortValue(left, inventoryRiskSort.field);
      const rightValue = getInventoryRiskSortValue(right, inventoryRiskSort.field);
      if (leftValue < rightValue) return -1 * direction;
      if (leftValue > rightValue) return 1 * direction;
      return compareRiskItems(left, right);
    }

    function renderRiskSortHeader(label, field) {
      const active = inventoryRiskSort.field === field;
      const icon = active ? (inventoryRiskSort.order === 'asc' ? '↑' : '↓') : '↕';
      return `
        <span class="th-sort">
          <span>${label}</span>
          <button class="sort-btn ${active ? 'active' : ''}" data-action="risk-sort" data-field="${field}" aria-label="按${label}排序">${icon}</button>
        </span>
      `;
    }

    function getInventoryRiskRows() {
      const snapshot = getCockpitSnapshot();
      return [...snapshot.risks, ...cockpitRiskFillers]
        .sort(compareRiskItems)
        .map((item, index) => ({
          ...item,
          rowId: `${item.title}-${getRiskType(item)}-${index}`,
          warehouse: getRiskWarehouse(item),
          riskType: getRiskType(item),
          riskLevelText: getRiskLevelText(item),
          availableText: getRiskAvailableText(item),
          lockRateText: getRiskLockRateText(item),
          highThresholdText: getRiskHighThresholdText(item),
          safeThresholdText: getRiskSafeThresholdText(item),
          statusText: getRiskStatusText(item),
          updatedAt: snapshot.updateTime
        }))
        .sort(compareInventoryRiskRows)
        .slice(0, 10);
    }

    function getInventoryRiskByRowId(rowId) {
      return getInventoryRiskRows().find((row) => row.rowId === rowId) || null;
    }

    function getInventoryQueryRows() {
      const currentWarehouse = warehouseName();
      return inventoryQueryRows.filter((row) => {
        if (currentWarehouse !== '全部仓库' && row.warehouse !== currentWarehouse) return false;
        return true;
      });
    }

    function getInventoryQueryRowById(rowId) {
      return inventoryQueryRows.find((row) => row.id === rowId) || null;
    }

    function getInventoryQueryStats(rows = getInventoryQueryRows()) {
      return {
        skuCount: rows.length,
        warehouseCount: new Set(rows.map((row) => row.warehouse)).size,
        available: rows.reduce((sum, row) => sum + Number(row.available || 0), 0),
        locked: rows.reduce((sum, row) => sum + Number(row.locked || 0), 0)
      };
    }

    function getInventoryDetailRows() {
      const currentWarehouse = warehouseName();
      return inventoryDetailRows.filter((row) => {
        const expectedWarehouse = inventoryDetailFilter.warehouse && inventoryDetailFilter.warehouse !== '全部仓库'
          ? inventoryDetailFilter.warehouse
          : currentWarehouse;
        if (expectedWarehouse !== '全部仓库' && row.warehouse !== expectedWarehouse) return false;
        if (inventoryDetailFilter.skuCode && row.skuCode !== inventoryDetailFilter.skuCode) return false;
        return true;
      });
    }

    function getInventoryDetailRowById(rowId) {
      return inventoryDetailRows.find((row) => row.id === rowId) || null;
    }

    function getInventoryDetailStats(rows = getInventoryDetailRows()) {
      return {
        rowCount: rows.length,
        locationCount: new Set(rows.map((row) => `${row.warehouse}-${row.zone}-${row.location}`)).size,
        available: rows.reduce((sum, row) => sum + Number(row.available || 0), 0),
        frozen: rows.reduce((sum, row) => sum + Number(row.frozen || 0), 0)
      };
    }

    function openInventoryDetailFromQuery(rowId) {
      const record = getInventoryQueryRowById(rowId);
      if (!record) return;
      inventoryDetailFilter = {
        skuCode: record.skuCode,
        warehouse: record.warehouse
      };
      selectedInventoryDetailId = '';
      if (warehouseSelect.querySelector(`option[value="${record.warehouse}"]`)) {
        warehouseSelect.value = record.warehouse;
      }
      navigateToItem('inventory-detail');
    }

    function getWarehouseOperationDetail(record) {
      if (!record) return null;
      const preset = warehouseOperationDetailMap[record.id];
      if (preset) return preset;
      return {
        contactName: record.customer,
        phone: '--',
        postcode: record.addressCode,
        shortAddress: `${record.warehouse} · ${record.channel}`,

          `创建时间：${record.createdAt}`,
          `承诺时间：${record.promiseTime}`,

    }

    function getFunnelPageConfig(pageKey = currentItem.key) {
      return funnelPageConfigs[pageKey] || null;
    }

    function getFunnelPageState(pageKey = currentItem.key) {
      return funnelTrackingState[pageKey] || { selectedId: '', type: '全部类型' };
    }

    function setFunnelPageState(pageKey, nextState) {
      if (!funnelTrackingState[pageKey]) return;
      funnelTrackingState = {
        ...funnelTrackingState,
        [pageKey]: {
          ...funnelTrackingState[pageKey],
          ...nextState
        }
      };
    }

    function resetFunnelPageState(pageKey) {
      setFunnelPageState(pageKey, {
        selectedId: '',

      });
    }

    function getFunnelPageKeyByGroup(group) {
      return funnelGroupPageMap[group] || '';
    }

    function getFunnelRows(pageKey = currentItem.key) {
      const config = getFunnelPageConfig(pageKey);
      const pageState = getFunnelPageState(pageKey);
      const currentWarehouse = warehouseName();
      if (!config) return [];
      return operationFunnelDetailRows.filter((row) => {
        if (row.group !== config.group) return false;
        if (currentWarehouse !== '全部仓库' && row.warehouse !== currentWarehouse) return false;
        if (pageState.type !== '全部类型' && row.type !== pageState.type) return false;
        return true;
      }).sort((left, right) => Number(right.waitMinutes || 0) - Number(left.waitMinutes || 0));
    }

    function getFunnelById(pageKey, rowId) {
      const config = getFunnelPageConfig(pageKey);
      if (!config) return null;
      return operationFunnelDetailRows.find((row) => row.id === rowId && row.group === config.group) || null;
    }

    function getOperationFunnelSuggestion(row) {
      if (row.type === '待入库') return '建议优先确认到仓时间、月台资源和收货校验进度，避免影响后续上架。';
      if (row.group === '仓内作业跟踪') return '建议核查仓内波次、揽货或复核分配是否均衡，并及时调整处理人。';
      if (row.type === '已送达（当日）') return '建议关注签收异常与回传状态，确认是否存在异常闭环任务。';
      return '建议进入履约执行跟踪继续定位节点卡点，确认责任人和下一步动作。';
    }

    function renderFunnelProgress(item, groupTotal) {
      const total = Math.max(groupTotal, 0);
      const currentValue = Math.max(parseNumericValue(item.value), 0);
      const overdueValue = Math.min(getOverdueCount(item), currentValue);
      const pendingValue = Math.max(currentValue - overdueValue, 0);
      const overdueWidth = total > 0 ? (overdueValue / total) * 100 : 0;
      const pendingWidth = total > 0 ? (pendingValue / total) * 100 : 0;
      return `
        <div class="progress funnel-progress" title="超时 ${overdueValue} 单 / 待处理 ${currentValue} 单 / 分组总量 ${total} 单">
          <span class="funnel-progress-segment funnel-progress-total"></span>
          <span class="funnel-progress-segment funnel-progress-pending" style="left:${overdueWidth}%; width:${pendingWidth}%"></span>
          <span class="funnel-progress-segment funnel-progress-overdue" style="left:0; width:${overdueWidth}%"></span>
        </div>
      `;
    }

    function renderDeliveredProgress(item) {
      const deliveredWidth = Math.min(Math.max(parseNumericValue(item.progress), 0), 100);
      return `
        <div class="progress" title="已送达 ${parseNumericValue(item.value)} 单">
          <div class="progress-bar" style="width:${deliveredWidth}%; background:linear-gradient(90deg,#00ab95,#4bcebe)"></div>
        </div>
      `;
    }

    function getRiskCategoryPriority(item) {
      if (item.value === '低库存' && String(item.meta).includes('高预警库存')) return 0;
      if (item.value === '高锁定占比') return 1;
      return 2;
    }

    function compareRiskItems(left, right) {
      const leftLevel = left.level === 'danger' ? 0 : 1;
      const rightLevel = right.level === 'danger' ? 0 : 1;
      if (leftLevel !== rightLevel) return leftLevel - rightLevel;

      const leftCategory = getRiskCategoryPriority(left);
      const rightCategory = getRiskCategoryPriority(right);
      if (leftCategory !== rightCategory) return leftCategory - rightCategory;

      return 0;
    }

          type: '业务主体',
          status: item.status || '启用',
          remark: item.remark || ''
        });

          id: `${record.id || 'DRAFT'}-SUB-001`,
          company: '',
          type: '主主体',
          status: record.status || '启用',

        });

    function getZoneById(id) {

    function getLocationRows() {
      return locationRows.filter((row) => {
        const warehouseMatched = warehouseName() === '全部仓库' || row.warehouse === warehouseName();
        return warehouseMatched;
      }).sort((left, right) => {
        const leftWarehouseIndex = warehouseRows.findIndex((item) => item.name === left.warehouse);
        const rightWarehouseIndex = warehouseRows.findIndex((item) => item.name === right.warehouse);
        if (leftWarehouseIndex !== rightWarehouseIndex) {
          return leftWarehouseIndex - rightWarehouseIndex;
        }
        const leftZoneSort = (getZoneById(left.zoneCode) || {}).sort || 0;
        const rightZoneSort = (getZoneById(right.zoneCode) || {}).sort || 0;
        if (leftZoneSort !== rightZoneSort) {
          return rightZoneSort - leftZoneSort;
        }
        return Number(right.sort || 0) - Number(left.sort || 0);
      });
    }

    function getLocationById(id) {
      return locationRows.find((item) => item.id === id);
    }

    function getRecognitionArchiveRows() {
      const archiveMap = new Map();
      getProductRows().forEach((row) => {
        if (!archiveMap.has(row.recognitionId)) {
          archiveMap.set(row.recognitionId, {
            id: row.recognitionId,
            mainBarcode: row.barcodes[0] || '--',
            unit: row.unit,
            specAttr: row.specAttr,
            storageSummary: [
              row.batchManaged ? '批次' : '非批次',
              row.expiryManaged ? '效期' : '非效期',
              row.snManaged ? 'SN' : '非SN',
              row.liquid ? '液体' : '常规'
            ].join(' / '),
            status: row.recognitionStatus,
            ownerCount: 0,
            owners: [],
            products: [],
            updatedAt: row.updatedAt
          });
        }
        const archive = archiveMap.get(row.recognitionId);
        archive.ownerCount += 1;
        archive.owners.push(row.owner);
        archive.products.push(row);
        if (row.updatedAt > archive.updatedAt) {
          archive.updatedAt = row.updatedAt;
        }
        if (archive.status !== '冲突待处理' && row.recognitionStatus === '冲突待处理') {
          archive.status = '冲突待处理';
        } else if (archive.status === '候选中' && row.recognitionStatus === '已生效') {
          archive.status = '已生效';
        }
      });
      const archives = Array.from(archiveMap.values());
      if (!selectedRecognitionId) return archives;
      return archives.filter((item) => item.id === selectedRecognitionId);
    }

      const allDone = record.type === '已送达（当日）';

      const timeLabels = { '待接单': '派单时间', '已接单': '接单时间', '已取货': '取货时间', '配送中': '配送时间', '已送达（当日）': '送达时间' };

              return `
                <div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;">

      const routeStops = [
        { name: 'Liuzhaobin | 5392000', addr: 'room15, crush cosss, malaysia street', note: '门牌号收货点', done: stop1Done },
        { name: 'Liuzhaobin | 5392000', addr: 'room15, crush cosss, malaysia street', note: '门牌号收货点', done: allDone },

      const metaBlock = `

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;">

      const footBtn = `<button class="ghost-btn" data-action="drawer-close">关闭</button>`;

      return { body: `${stepBar}${riderBlock}${routeBlock}${feeBlock}${metaBlock}`, foot: footBtn };

    function openDrawer(mode, id) {
      requirementDrawerOpen = false;
      if (currentItem.key === 'warehouse') {
        const record = id ? getWarehouseById(id) : null;
        drawerState = {
          entity: 'warehouse',
          mode,
          id: id || null,
          serviceMenuOpen: false,
          serviceTags: getEditableServiceTags(record ? record.serviceTags : ['常温'])
        };
      } else if (currentItem.key === 'warehouse-staff') {
        drawerState = {
          entity: 'warehouse-staff',
          mode,
          id: id || null
        };
      } else if (currentItem.key === 'owner') {
        drawerState = {
          entity: 'owner',
          mode,
          id: id || null
        };
      } else if (currentItem.key === 'zone') {
        drawerState = {
          entity: 'zone',
          mode,
          id: id || null
        };
      } else if (currentItem.key === 'location') {
        drawerState = {
          entity: 'location',
          mode,
          id: id || null
        };
      } else if (currentItem.key === 'sku' || currentItem.key === 'my-product' || currentItem.key === 'product-owner-manage') {
        drawerState = {
          entity: 'sku',
          mode,
          id: id || null
        };
      } else if (currentItem.key === 'exception-urgent-list') {
        drawerState = {
          entity: 'urgent-todo',
          mode,
          id: id || null
        };
      } else if (getFunnelPageConfig(currentItem.key)) {
        const config = getFunnelPageConfig(currentItem.key);
        drawerState = {
          entity: config.entity,
          mode,
          id: id || null,
          pageKey: currentItem.key
        };
      } else if (currentItem.key === 'inventory-detail') {
        drawerState = {
          entity: 'inventory-detail',
          mode,
          id: id || null
        };
      } else if (currentItem.key === 'inventory-risk-list') {
        drawerState = {
          entity: 'inventory-risk',
          mode,
          id: id || null
        };
      }
      renderOverlay();
    }

    function closeDrawer() {
      if (drawerState && drawerState.entity === 'urgent-todo') {
        selectedUrgentTodoId = '';
      }
      if (drawerState && ['warehouse-operation-funnel', 'fulfillment-link-funnel'].includes(drawerState.entity) && drawerState.pageKey) {
        setFunnelPageState(drawerState.pageKey, { selectedId: '' });
      }
      if (drawerState && drawerState.entity === 'inventory-detail') {
        selectedInventoryDetailId = '';
      }
      if (drawerState && drawerState.entity === 'inventory-risk') {
        selectedRiskRowId = '';
      }
      drawerState = null;
      renderOverlay();
    }

    function openRequirementDrawer() {
      const requirementKey = getRequirementDocKey();
      if (!requirementKey) return;
      drawerState = null;
      requirementDrawerOpen = true;
      requirementEditMode = false;
      requirementDraft = null;
      renderOverlay();
      if (isExternalRequirementDoc(requirementKey)) {
        loadExternalRequirementDoc(requirementKey);
      }
    }

    function closeRequirementDrawer() {
      requirementDrawerOpen = false;
      requirementEditMode = false;
      requirementDraft = null;
      renderOverlay();
    }

    function startRequirementEdit() {
      if (isExternalRequirementDoc()) return;
      const doc = getRequirementDoc();
      if (!doc) return;
      requirementEditMode = true;
      requirementDraft = cloneTemplate(doc);
      renderOverlay();
    }

    function cancelRequirementEdit() {
      requirementEditMode = false;
      requirementDraft = null;
      requirementSaveState = 'idle';
      renderOverlay();
    }

    function updateRequirementField(field, value) {
      const doc = getRequirementWorkingDoc();
      if (!doc) return;
      doc[field] = value;
      markRequirementDirty();
    }

    function updateRequirementList(field, value) {
      const doc = getRequirementWorkingDoc();
      if (!doc) return;
      doc[field] = String(value || '')
        .split('\n')
        .map((item) => item.trim())
        .filter(Boolean);
      markRequirementDirty();
    }

    function updateRequirementTableCell(tableKey, rowIndex, columnKey, value) {
      const doc = getRequirementWorkingDoc();
      if (!doc || !doc[tableKey] || !doc[tableKey][rowIndex]) return;
      doc[tableKey][rowIndex][columnKey] = value;
      markRequirementDirty();
    }

    async function saveRequirementData() {
      requirementSaveState = 'saving';
      syncRequirementStatusUi();
      try {
        const requirementKey = getRequirementDocKey();
        if (!requirementKey || !requirementDraft) {
          throw new Error('当前没有可保存的编辑内容');
        }
        requirementData[requirementKey] = cloneTemplate(requirementDraft);
        const response = await fetch('/__save_requirement__', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file: requirementFileName,
            data: requirementData
          })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.message || '保存失败');
        }
        if (requirementSeedNode) {
          requirementSeedNode.textContent = JSON.stringify(requirementData, null, 2);
        }
        requirementSaveState = 'saved';
        requirementEditMode = false;
        requirementDraft = null;
        syncRequirementStatusUi();
        openModal({
          title: '保存成功',
          message: '简易需求文档已写回当前原型 HTML 文件，你下次刷新页面仍会保留最新内容。',
          confirmText: '知道了',
          confirmStyle: 'ghost'
        });
      } catch (error) {
        requirementSaveState = 'error';
        syncRequirementStatusUi();
        openModal({
          title: '保存失败',
          message: error.message || '当前保存失败，请确认本地可写原型服务已启动。',
          confirmText: '我知道了',
          confirmStyle: 'ghost'
        });
      }
    }

    function openModal(config) {
      modalState = config;
      renderOverlay();
    }

    function closeModal() {
      modalState = null;
      renderOverlay();
    }

                <div class="ib-detail-meta-grid">

                  <div class="ib-detail-meta-item"><div class="ib-detail-meta-label">入库类型</div><div class="ib-detail-meta-val">${order.type}</div></div>

              <div style="background:#fff;border-radius:16px;border:1px solid rgba(29,29,31,0.07);overflow:hidden;${isFailed?'':''}">

                <div class="table-wrap flat" style="border-radius:0;border:none;border-top:1px solid rgba(29,29,31,0.06)">
                  ${inboundDetailTab==='items'?`
                  <table class="table-dense">

      return `
        <div class="ib-confirm-overlay">

            <div class="ib-confirm-title">${c.title}</div>
            <div class="ib-confirm-msg">${c.msg}</div>
            <div class="ib-confirm-actions">
              <button class="ib-btn outline" data-action="ib-confirm-cancel">取消</button>

            </div>

    function ibAddRow(preset) {
      const r = Object.assign({ id: inboundItemSeq++, seq: inboundItems.length+1, barcode:'', skuCode:'', name:'', spec:'', unit:'', qty:1, batch:'', mfgDate:'', expDate:'', _new:true }, preset||{});
      inboundItems.push(r);
      return r;
    }

    function ibRefreshTable() {
      const tbody = document.getElementById('ibItemsTbody');
      if (!tbody) return;
      if (inboundItems.length === 0) {
        tbody.innerHTML = `<tr id="ibEmptyRow"><td colspan="11" class="ib-items-empty">暂无商品，请扫描条形码或手动添加</td></tr>`;
      } else {
        tbody.innerHTML = inboundItems.map(r=>ibItemRow(r)).join('');
      }
      const footer = tbody.closest('.ib-card')?.querySelector('.ib-items-footer-row');
      if (footer) footer.innerHTML = `${inboundItems.length} 行 · 合计 <strong style="margin-left:4px;color:var(--text)">${ibTotalQty(inboundItems)}</strong> 件`;
    }

    function ibSyncFormFromDOM() {
      const t = document.getElementById('ibFmType');
      const w = document.getElementById('ibFmWarehouse');
      const s = document.getElementById('ibFmSourceNo');
      const r = document.getElementById('ibFmRemark');
      if (t) inboundForm.type = t.value;
      if (w) inboundForm.warehouse = w.value;
      if (s) inboundForm.sourceNo = s.value;
      if (r) inboundForm.remark = r.value;
    }

    function ibValidateForm(items) {
      if (!items.length) return '请至少添加一条商品';
      for (const r of items) { if (!r.qty || parseInt(r.qty) < 1) return `第 ${r.seq} 行入库数量不能为空`; }
      return null;
    }

    function ibShowFeedback(msg, type) {
      const el = document.getElementById('ibScanFeedback');
      if (!el) return;
      el.className = `ib-scan-feedback ${type}`;
      el.textContent = msg;
      clearTimeout(el._timer);
      el._timer = setTimeout(()=>{ el.classList.add('fade'); }, 2000);
    }

    function setupInboundPage() {
      const scanInput = document.getElementById('ibScanInput');
      if (!scanInput) return;
      scanInput.focus();
      scanInput.addEventListener('keydown', (e)=>{
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const code = scanInput.value.trim();
        if (!code) return;
        const dup = inboundItems.find(r=>r.barcode===code);
        if (dup) {
          inboundConfirm = {
            title: '商品已存在', msg: `条码 ${code} 已在列表第 ${dup.seq} 行，是否再添加一行？`,
            okLabel: '继续添加', danger: false,
            _afterOk: ()=>{ const prod=ibProductByBarcode[code]; ibAddRow(prod?{...prod,barcode:code}:{barcode:code}); ibRefreshTable(); }
          };
          const canvas = document.getElementById('canvas');
          canvas.innerHTML = renderInboundConfirmModal();
          return;
        }
        const prod = ibProductByBarcode[code];
        ibAddRow(prod ? {...prod, barcode:code} : { barcode:code });
        ibRefreshTable();
        const fb = document.createElement('div');
        fb.id = 'ibScanFeedback';
        fb.className = `ib-scan-feedback ok`;
        fb.textContent = prod ? `✓ 已添加：${prod.name}` : `✓ 已添加未知商品，请手动补充信息`;
        const bar = scanInput.closest('.ib-scan-body');
        if (bar) { const old=bar.querySelector('#ibScanFeedback'); if(old) old.remove(); bar.appendChild(fb); }
        setTimeout(()=>fb.classList.add('fade'),2000);
        scanInput.value = '';
        scanInput.focus();
      });
      // live cell editing
      const canvas = document.getElementById('canvas');
      canvas.addEventListener('input', (e)=>{
        const inp = e.target.closest('[data-field][data-id]');
        if (!inp) return;
        const id = parseInt(inp.dataset.id);
        const field = inp.dataset.field;
        const r = inboundItems.find(x=>x.id===id);
        if (r) {
          r[field] = inp.value;
          if (field==='qty') {
            const footer = canvas.querySelector('.ib-items-footer-row');
            if (footer) footer.innerHTML = `${inboundItems.length} 行 · 合计 <strong style="margin-left:4px;color:var(--text)">${ibTotalQty(inboundItems)}</strong> 件`;
          }
        }
      });
    }

    function renderPlaceholder(item, group) {
      return `
        <section class="hero">
          <h1>${item.name}</h1>
          <p>当前查看范围为 <strong>${scopeLabel()}</strong>。本页已接入新版导航母版与顶部仓库/货主/门店联动筛选，后续在此基础上继续展开完整高保真页面。</p>
          <div class="hero-toolbar">
            <button class="primary-btn">进入页面设计</button>
            <div class="chip"><strong>页面编号</strong>${item.page}</div>
          </div>
        </section>
        <section class="section-card">
          <div class="section-head"><div><h2 class="section-title">页面结构预留</h2><div class="section-desc">当前先保留该页面的高保真占位结构，后续继续补全筛选、列表、详情和操作反馈。</div></div></div>
          <div class="placeholder-grid">
            <article class="placeholder-card"><h3>筛选区</h3><p>承接搜索、状态、仓库、货主、门店、时间等筛选组件，保持与顶部联动一致。</p></article>
            <article class="placeholder-card"><h3>主体区</h3><p>列表、卡片或配置内容区域，控制信息密度并保持足够留白。</p></article>
            <article class="placeholder-card"><h3>详情区</h3><p>用于承接抽屉、弹窗或详情卡片，统一延续当前母版风格。</p></article>
          </div>
        </section>
      `;

    function renderPage(item, group) {
      currentItem = item;
      currentGroup = group;
      if (breadcrumbModule) breadcrumbModule.textContent = group.name;
      if (breadcrumbPage) breadcrumbPage.textContent = item.name;
      notifyParentPageReady(group, item);
      canvas.classList.toggle('cockpit-mode', item.key === 'cockpit');
      if (item.key === 'cockpit') {
        canvas.innerHTML = renderCockpit();
      } else if (item.key === 'owner') {
        canvas.innerHTML = renderOwnerPage();
      } else if (item.key === 'warehouse') {
        canvas.innerHTML = renderWarehousePage();
      } else if (item.key === 'zone') {
        canvas.innerHTML = renderZonePage();
      } else if (item.key === 'location') {
        canvas.innerHTML = renderLocationPage();
      } else if (item.key === 'warehouse-staff') {
        canvas.innerHTML = renderWarehouseStaffPage();
      } else if (item.key === 'my-product') {
        canvas.innerHTML = renderMyProductPage();
      } else if (item.key === 'product-owner-manage') {
        canvas.innerHTML = renderOwnerProductManagePage();
      } else if (item.key === 'exception-urgent-list') {
        canvas.innerHTML = renderExceptionUrgentListPage();
      } else if (item.key === 'inventory-query') {
        canvas.innerHTML = renderInventoryQueryPage();
      } else if (item.key === 'inventory-detail') {
        canvas.innerHTML = renderInventoryDetailPage();
      } else if (item.key === 'warehouse-operation-track-list' || item.key === 'fulfillment-link-track-list') {
        canvas.innerHTML = renderFunnelListPage(item.key);
      } else if (item.key === 'inventory-risk-list') {
        canvas.innerHTML = renderInventoryRiskListPage();
      } else if (item.key === 'shop') {
        canvas.innerHTML = renderStorePage();
      } else if (item.key === 'inbound') {
        inboundView = 'list';
        inboundDetailId = null;
        inboundConfirm = null;
        canvas.innerHTML = renderInboundPage();
        setupInboundPage();
      } else {
        canvas.innerHTML = renderPlaceholder(item, group);
      }
      if (item.key === 'my-product') {
        const statsCollapse = canvas.querySelector('#statsCollapse');
        statsCollapse?.addEventListener('transitionend', (event) => {
          if (event.propertyName !== 'height') return;
          if (myProductStatsExpanded) statsCollapse.style.height = 'auto';
        });
        applyMyProductStatsExpanded(myProductStatsExpanded, false);
      }
      renderOverlay();
    }

    function navigateToItem(itemKey) {
      const targetGroup = menuData.find((group) => group.items.some((item) => item.key === itemKey));
      const targetItem = targetGroup && targetGroup.items.find((item) => item.key === itemKey);
      if (!targetGroup || !targetItem) return;
      menuData.forEach((group) => group.items.forEach((item) => item.active = false));
      targetItem.active = true;
      renderNav();
      renderPage(targetItem, targetGroup);
      syncStandalonePageUrl(targetItem.key);
    }

    function renderNav() {
      nav.innerHTML = '';
      const query = menuQuery.trim();

      menuData.forEach((group) => {
        const groupMatched = fuzzyMatch(`${group.name} ${group.meta}`, query);
        const visibleItems = !query
          ? group.items
          : group.items.filter((item) => fuzzyMatch(`${item.name} ${item.page}`, query));

        if (query && !groupMatched && visibleItems.length === 0) {
          return;
        }

        const isActiveGroup = group.items.some((item) => item.active);
        const wrapper = document.createElement('div');
        wrapper.className = 'nav-group'
          + (group.direct ? ' is-direct' : '')
          + ((query || isActiveGroup) && !group.direct ? ' is-open' : '');
        const head = document.createElement('button');
        head.className = 'nav-group-button'
          + (isActiveGroup ? ' active' : '')
          + (isActiveGroup && group.direct ? ' active-direct' : '')
          + (isActiveGroup && !group.direct ? ' active-parent' : '');
        head.innerHTML = `
          <div class="nav-group-left">
            <span class="nav-icon">${iconSvg(group.icon)}</span>
            <div>
              <div class="nav-group-name">${group.name}</div>
              <div class="nav-group-meta">${group.meta}</div>
            </div>
          </div>
          <span class="nav-caret">⌃</span>
        `;
        head.addEventListener('click', () => {
          if (group.direct) {
            const targetItem = group.items[0];
            menuData.forEach((g) => g.items.forEach((sub) => sub.active = false));
            targetItem.active = true;
            renderNav();
            renderPage(targetItem, group);
            return;
          }
          wrapper.classList.toggle('is-open');
        });
        const items = document.createElement('div');
        items.className = 'nav-items';
        (query && groupMatched ? group.items : visibleItems).forEach((item) => {
          const btn = document.createElement('button');
          btn.className = 'nav-item' + (item.active ? ' active' : '');
          btn.textContent = item.name;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuData.forEach((g) => g.items.forEach((sub) => sub.active = false));
            item.active = true;
            renderNav();
            renderPage(item, group);
          });
          items.appendChild(btn);
        });
        wrapper.appendChild(head);
        if (!group.direct) {
          wrapper.appendChild(items);
        }
        nav.appendChild(wrapper);
      });
    }

    function autoResizeTextarea(textarea) {
      if (!textarea) return;
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function syncAutoResizeTextareas() {
      overlayRoot.querySelectorAll('.req-textarea').forEach(autoResizeTextarea);
    }

    function rerenderCurrent() {
      syncScope();
      renderPage(currentItem, currentGroup);
    }

    function applyMyProductStatsExpanded(nextExpanded, animate = true) {
      const statsToggle = canvas.querySelector('#statsToggle');
      const statsCollapse = canvas.querySelector('#statsCollapse');
      const statsGrid = canvas.querySelector('#statsGrid');
      if (!statsToggle || !statsCollapse || !statsGrid) return;

      myProductStatsExpanded = nextExpanded;
      statsToggle.setAttribute('aria-expanded', String(nextExpanded));

      if (nextExpanded) {
        if (!animate) {
          statsCollapse.style.height = 'auto';
          return;
        }
        const currentHeight = statsCollapse.getBoundingClientRect().height;
        statsCollapse.style.height = `${currentHeight}px`;
        const targetHeight = statsGrid.scrollHeight;
        requestAnimationFrame(() => {
          statsCollapse.style.height = `${targetHeight}px`;
        });
        return;
      }

      if (!animate) {
        statsCollapse.style.height = '0px';
        return;
      }

      const currentHeight = statsCollapse.getBoundingClientRect().height || statsGrid.scrollHeight;
      statsCollapse.style.height = `${currentHeight}px`;
      requestAnimationFrame(() => {
        statsCollapse.style.height = '0px';
      });
    }

    function setSelectValue(select, value) {
      if (!select || value == null) return;
      const option = Array.from(select.options).find((candidate) => candidate.value === value);
      if (option) select.value = value;
    }

    window.addEventListener('message', (event) => {
      const message = event.data || {};
      if (message.type !== 'wms-scope-change') return;
      const scope = message.scope || {};
      setSelectValue(warehouseSelect, scope.warehouse);
      setSelectValue(ownerSelect, scope.owner);
      setSelectValue(storeSelect, scope.store);
      rerenderCurrent();
    });

    warehouseSelect.addEventListener('change', rerenderCurrent);
    ownerSelect.addEventListener('change', rerenderCurrent);
    storeSelect.addEventListener('change', rerenderCurrent);
    menuSearchInput.addEventListener('input', (event) => {
      menuQuery = event.target.value || '';
      renderNav();
    });
    breadcrumbHome && breadcrumbHome.addEventListener('click', () => {
      navigateToItem('cockpit');
    });
    canvas.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const { action, id, mode } = target.dataset;
      if (action === 'cockpit-open') {
        navigateToItem(target.dataset.target);
        return;
      }
      if (action === 'funnel-open') {
        const group = target.dataset.group || '';
        const pageKey = getFunnelPageKeyByGroup(group);
        if (!pageKey) return;
        setFunnelPageState(pageKey, {
          selectedId: '',
          type: target.dataset.type || '全部类型'
        });
        navigateToItem(pageKey);
        return;
      }
      if (action === 'urgent-view') {
        selectedUrgentTodoId = id || '';
        openDrawer('view', id || '');
        return;
      }
      if (action === 'urgent-query') {
        if (drawerState && drawerState.entity === 'urgent-todo') {
          closeDrawer();
        }
        renderPage(currentItem, currentGroup);
        return;
      }
      if (action === 'urgent-reset') {
        selectedUrgentTodoId = '';
        if (drawerState && drawerState.entity === 'urgent-todo') {
          closeDrawer();
          return;
        }
        renderPage(currentItem, currentGroup);
        return;
      }
      if (action === 'urgent-export') {
        return;
      }
      if (action === 'urgent-open-target') {
        navigateToItem(target.dataset.targetPage);
        return;
      }
      if (action === 'risk-sort') {
        const field = target.dataset.field || 'priority';
        if (inventoryRiskSort.field === field) {
          inventoryRiskSort.order = inventoryRiskSort.order === 'asc' ? 'desc' : 'asc';
        } else {
          inventoryRiskSort = {
            field,
            order: getInventoryRiskDefaultSortOrder(field)
          };
        }
        renderPage(currentItem, currentGroup);
        return;
      }
      if (action === 'risk-query') {
        if (drawerState && drawerState.entity === 'inventory-risk') {
          closeDrawer();
        }
        renderPage(currentItem, currentGroup);
        return;

        const ord = ibOrders.find(o=>o.id===id);
        if (!ord) return;
        inboundConfirm = { title:'重新提交入库', msg:`将重新提交入库单 ${id}，系统将再次尝试库存入账。`, okLabel:'确认提交', danger:false,
          _afterOk: ()=>{ ord.status='done'; ord.items.forEach(r=>{if(r.ledger==='failed')r.ledger='done';}); inboundConfirm=null; inboundView='detail'; inboundDetailId=id; ibRerender(); }
        };
        ibRerender(); return;
      }
      if (action === 'ib-filter-search') {
        const fType = document.getElementById('ibFType');
        const fStatus = document.getElementById('ibFStatus');
        const fDateStart = document.getElementById('ibFDateStart');
        const fDateEnd = document.getElementById('ibFDateEnd');
        if (fType) inboundFilterType = fType.value === '全部入库类型' ? '全部' : fType.value;
        if (fStatus) inboundFilterStatus = fStatus.value === '全部入库状态' ? '全部' : fStatus.value;
        if (fDateStart) inboundFilterDateStart = fDateStart.value;
        if (fDateEnd) inboundFilterDateEnd = fDateEnd.value;
        ibRerender(); return;
      }
      if (action === 'ib-filter-reset') {
        inboundFilterType = '全部'; inboundFilterStatus = '全部';
        inboundFilterDateStart = ''; inboundFilterDateEnd = '';
        ibRerender(); return;
      }
      if (action === 'ib-add-row') {
        ibSyncFormFromDOM();
        ibAddRow();
        ibRefreshTable(); return;
      }
      if (action === 'ib-delete-row') {
        const rid = parseInt(id);
        inboundItems = inboundItems.filter(r=>r.id!==rid);
        inboundItems.forEach((r,i)=>r.seq=i+1);
        ibRefreshTable(); return;
      }
      if (action === 'ib-save-draft') {
        ibSyncFormFromDOM();
        if (inboundDetailId) {
          const ord = ibOrders.find(o=>o.id===inboundDetailId);
          if (ord) { Object.assign(ord, inboundForm); ord.items=[...inboundItems]; }
        } else {
          ibOrders.push({ id:ibGenId(), ...inboundForm, skuCount:new Set(inboundItems.map(r=>r.skuCode).filter(Boolean)).size||inboundItems.length,
            qty:ibTotalQty(inboundItems), status:'draft', creator:'仓库管理员', createdAt:ibNowStr(), submittedAt:'', items:[...inboundItems] });
        }
        inboundView='list'; inboundDetailId=null; inboundItems=[]; inboundItemSeq=1;
        inboundForm={type:'采购入库',warehouse:'1号仓库',sourceNo:'',remark:''};
        ibRerender(); return;
      }
      if (action === 'ib-submit') {
        ibSyncFormFromDOM();
        const err = ibValidateForm(inboundItems);
        if (err) { alert(err); return; }
        inboundConfirm = { title:'提交入库', msg:'提交后将直接更新库存，操作不可撤销，确认提交？', okLabel:'确认提交', danger:false,
          _afterOk: ()=>{
            const newItems = inboundItems.map(r=>({...r, ledger:'done'}));
            if (inboundDetailId) {
              const ord=ibOrders.find(o=>o.id===inboundDetailId);
              if(ord){Object.assign(ord,inboundForm);ord.items=newItems;ord.status='done';ord.submittedAt=ibNowStr();ord.skuCount=new Set(newItems.map(r=>r.skuCode).filter(Boolean)).size||newItems.length;}
            } else {
              ibOrders.unshift({id:ibGenId(),...inboundForm,skuCount:new Set(newItems.map(r=>r.skuCode).filter(Boolean)).size||newItems.length,
                qty:ibTotalQty(newItems),status:'done',creator:'仓库管理员',createdAt:ibNowStr(),submittedAt:ibNowStr(),items:newItems});
            }
            inboundConfirm=null; inboundView='list'; inboundDetailId=null; inboundItems=[]; inboundItemSeq=1;
            inboundForm={type:'采购入库',warehouse:'1号仓库',sourceNo:'',remark:''};
            ibRerender();
          }
        };
        ibRerender(); return;
      }
      if (action === 'ib-confirm-ok') {
        if (inboundConfirm && inboundConfirm._afterOk) inboundConfirm._afterOk();
        else { inboundConfirm=null; ibRerender(); }
        return;
      }
      if (action === 'ib-confirm-cancel') {
        inboundConfirm = null; ibRerender(); return;
      }
      if (action === 'ib-tab-items') {
        inboundDetailTab = 'items'; ibRerender(); return;
      }
      if (action === 'ib-tab-ledger') {
        inboundDetailTab = 'ledger'; ibRerender(); return;
      }
      /* ── end 入库管理事件 ── */
    });
    overlayRoot.addEventListener('input', (event) => {
      const target = event.target;
      if (target.classList && target.classList.contains('req-textarea')) {
        autoResizeTextarea(target);
      }
      if (target.dataset.reqField) {
        updateRequirementField(target.dataset.reqField, target.value);
      }
      if (target.dataset.reqList) {
        updateRequirementList(target.dataset.reqList, target.value);
      }
      if (target.dataset.reqTable) {
        updateRequirementTableCell(
          target.dataset.reqTable,
          Number(target.dataset.rowIndex),
          target.dataset.columnKey,
          target.value
        );
      }
    });
    overlayRoot.addEventListener('click', (event) => {
      const actionTarget = event.target.closest('[data-action]');
      const multiSelectNode = event.target.closest('.multi-select');
      if (!actionTarget) {
        if (drawerState && drawerState.serviceMenuOpen && !multiSelectNode) {
          drawerState.serviceMenuOpen = false;
          renderOverlay();
        }
        return;
      }
      const { action, value } = actionTarget.dataset;
      if (action === 'drawer-mask-close' && actionTarget !== event.target) {
        return;
      }
      if (action === 'modal-close' && actionTarget !== event.target) {
        return;
      }
      if (action === 'requirement-mask-close' && actionTarget !== event.target) {
        return;
      }
      if (action === 'toggle-service-menu' && drawerState && drawerState.entity === 'warehouse') {
        drawerState.serviceMenuOpen = !drawerState.serviceMenuOpen;
        renderOverlay();
        return;
      }
      if (action === 'requirement-add-row') {
        const { table } = actionTarget.dataset;
        const doc = getRequirementWorkingDoc();
        if (doc && requirementRowTemplates[table]) {
          doc[table].push(cloneTemplate(requirementRowTemplates[table]));
          markRequirementDirty();
          renderOverlay();
        }
        return;
      }
      if (action === 'requirement-delete-row') {
        const { table, rowIndex } = actionTarget.dataset;
        const doc = getRequirementWorkingDoc();
        if (doc && doc[table] && doc[table].length > 1) {
          doc[table].splice(Number(rowIndex), 1);
          markRequirementDirty();
          renderOverlay();
        }
        return;
      }
      if (action === 'requirement-start-edit') {
        startRequirementEdit();
        return;
      }
      if (action === 'requirement-cancel-edit') {
        cancelRequirementEdit();
        return;
      }
      if (action === 'requirement-save') {
        saveRequirementData();
        return;
      }
      if (action === 'requirement-reload') {
        if (isExternalRequirementDoc()) {
          syncRequirementDocsBeforeReload().finally(() => {
            loadExternalRequirementDoc(getRequirementDocKey(), true);
          });
          return;
        }
        loadExternalRequirementDoc(getRequirementDocKey(), true);
        return;
      }
      if (action === 'requirement-close' || action === 'requirement-mask-close') {
        closeRequirementDrawer();
        return;
      }
      if (action === 'toggle-service-option' && drawerState && drawerState.entity === 'warehouse') {
        const currentTags = getEditableServiceTags(drawerState.serviceTags);
        const nextTags = currentTags.includes(value)
          ? currentTags.filter((item) => item !== value)
          : [...currentTags, value];
        drawerState.serviceTags = nextTags.length ? nextTags : [value];
        drawerState.serviceMenuOpen = true;
        renderOverlay();
        return;
      }
      if (action === 'drawer-close' || action === 'drawer-mask-close') {
        closeDrawer();
      }
      if (action === 'warehouse-save') {
        closeDrawer();
        renderPage(currentItem, currentGroup);
        return;
      }
      if (action === 'owner-save' || action === 'zone-save' || action === 'location-save' || action === 'sku-save') {
        closeDrawer();
        renderPage(currentItem, currentGroup);
        return;
      }
      if (action === 'modal-close' || action === 'modal-cancel') {
        closeModal();
      }
      if (action === 'modal-confirm' && modalState && typeof modalState.onConfirm === 'function') {
        modalState.onConfirm();
      }
    });

    syncScope();
    renderNav();
    renderPage(currentItem, currentGroup);

</script>
</body>
</html>
