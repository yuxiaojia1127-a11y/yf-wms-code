<style>

.screen{display:none;min-height:812px;flex-direction:column}

.diff-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.diff-row .k{color:var(--app-text-secondary)}

.btn-ghost{border:1px solid var(--app-primary);background:#fff;color:var(--app-primary)}
.btn-danger-o{border:1px solid var(--app-danger);background:#fff;color:var(--app-danger)}
.btn-primary{border:none;background:var(--app-primary);color:#fff}
.btn-primary:active{background:var(--app-primary-strong)}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none}
.mask.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;background:#fff;border-radius:16px 16px 0 0;z-index:55;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s}

.sheet-close{border:none;background:none;font-size:18px;color:var(--app-text-muted);cursor:pointer}
.filter-body{padding:4px 16px 8px;overflow-y:auto}

.filter-label{font-size:13px;color:var(--app-text-secondary);margin-bottom:8px}

.filter-dates{display:flex;align-items:center;gap:8px}

.filter-foot{display:flex;gap:10px;padding:10px 16px 18px;border-top:1px solid var(--app-border)}
.filter-foot button{flex:1;height:42px;border-radius:21px;font-size:14px;font-weight:600;cursor:pointer}
.btn-reset{border:1px solid var(--app-border);background:#fff;color:var(--app-text-secondary)}
.btn-apply{border:none;background:var(--app-primary);color:#fff}
#confirmMask{align-items:center;justify-content:center}
#confirmMask.show{display:flex}
.modal{width:286px;background:#fff;border-radius:14px;padding:18px;text-align:center}
.modal h3{font-size:15px;margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--app-text-secondary);margin-bottom:16px;line-height:1.6}
.modal-acts{display:flex;gap:10px}
.modal-acts button{flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer}

.toast{position:absolute;left:50%;top:46%;transform:translateX(-50%);background:rgba(31,35,41,.88);color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap;text-align:center}
.toast.show{opacity:1}
</style>

 {id:203,no:"PD20260619003",type:"sample",scope:"膨化食品",warehouseId:7,warehouseName:"KL自营仓库",counter:"张敏",date:"2026-06-19",time:"15:20",status:4,remark:"专区抽盘，差异已复核调账",items:[
   {lineNo:1,skuId:104,name:"【扫货榜】银鹭牛奶花生 360g",spec:"360g*1罐",barcode:"2000000039695",book:94,counted:95,reason:"错记"},
   {lineNo:2,skuId:107,name:"海底捞番茄火锅底料 200g-促销商品（测试超长标题）",category:"12.12好货",spec:"200g",barcode:"003134555",book:95,counted:93,reason:"破损"}]},
 {id:204,no:"PD20260620004",type:"full",scope:"",warehouseId:13,warehouseName:"静库2-合作",counter:"张敏",date:"2026-06-20",time:"10:05",status:1,remark:"刚生成账面快照，待开始",items:[
   {lineNo:1,skuId:172,name:"Super Ring 小飞侠芝士圈 60g",category:"膨化食品",spec:"60g",barcode:"6900000000008",book:3,counted:null,reason:""},
   {lineNo:2,skuId:174,name:"MAMEE金厨隆冬风味 97g*4/袋",category:"膨化食品",spec:"2包",barcode:"333333",book:14,counted:null,reason:""}]},
 {id:205,no:"PD20260618005",type:"sample",scope:"新鲜水果",warehouseId:10,warehouseName:"嘿咻库房",counter:"李海",date:"2026-06-18",time:"14:30",status:5,remark:"重复创建，作废",items:[
   {lineNo:1,skuId:83,name:"商品分发",category:"新鲜水果",spec:"210g*1袋",barcode:"2000001",book:500,counted:null,reason:""}]}
];
const reasonMap={"破损":"Damaged","过期":"Expired","错记":"Miscount","被盗":"Theft","其它":"Other"};

(()=>{
 const PAGE_SIZE=5;
 const params=new URLSearchParams(location.search);
 const isEmbedded=window.parent&&window.parent!==window;
 let locale=params.get("locale")||"zh";
 const $=(id)=>document.getElementById(id);
 const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const T=()=>locale==="zh";
 const typeMeta=(id)=>stTypes.find(t=>t.id===id)||stTypes[0];

 function carryQuery(extra){const q=new URLSearchParams(location.search);q.set("locale",locale);if(extra)Object.entries(extra).forEach(([k,v])=>q.set(k,v));return q.toString();}
 function goWorkbench(){if(isEmbedded)window.parent.postMessage({type:"wms-navigate",route:"workbench"},"*");else location.href="workbench.html?"+carryQuery();}
 function goFeature(menuId,page,extra){if(isEmbedded)window.parent.postMessage({type:"wms-navigate",route:"feature",menuId},"*");else location.href=page+"?"+carryQuery(extra);}
 function goCount(id){try{localStorage.setItem("wms_stocktake_count",String(id));}catch(e){}goFeature("stocktake_count","stocktake-count.html",{id});}

 const state={tab:"all",kw:"",page:1,filter:{type:"",whId:"",start:"",end:""}};
 let curId=null,pendingCb=null;

 function toast(msg){const el=$("toast");el.innerHTML=msg;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1600);}
 function statusZh(s){const m=statusMap[s];return T()?m.zh:m.en;}
 function progress(o){const total=o.items.length;const done=o.items.filter(i=>i.counted!=null).length;return{total,done,pct:total?Math.round(done/total*100):0};}
 function diffStats(o){let cnt=0,gain=0,loss=0;o.items.forEach(i=>{if(i.counted!=null){const d=i.counted-i.book;if(d!==0)cnt++;if(d>0)gain+=d;if(d<0)loss+=d;}});return{cnt,gain,loss};}

 function renderStatic(){
   $("navTitle").textContent=T()?"盘点任务":"Stocktake Tasks";
   $("searchInput").placeholder=T()?"搜索盘点单号":"Search no.";
   $("newBtn").textContent="＋ "+(T()?"新建":"New");
   $("filterTitle").textContent=T()?"筛选":"Filter";
   $("flbType").textContent=T()?"盘点类型":"Type";$("flbWh").textContent=T()?"库房":"Warehouse";$("flbDate").textContent=T()?"创建时间":"Created";
   $("filterReset").textContent=T()?"重置":"Reset";$("filterApply").textContent=T()?"确定":"Apply";
   const cTodo=orders.filter(o=>o.status===1||o.status===2).length;
   const cReview=orders.filter(o=>o.status===3).length;
   const withN=(l,n)=>T()?`${l}（${n}）`:`${l} (${n})`;
   const tabs=[["all",T()?"全部":"All"],["todo",withN(T()?"待盘点":"To count",cTodo)],["review",withN(T()?"待复核":"Review",cReview)],["done",T()?"已完成":"Done"],["void",T()?"已作废":"Voided"]];
   $("tabs").innerHTML=tabs.map(([k,l])=>`<div class="ib-tab ${k===state.tab?"on":""}" data-tab="${k}">${l}</div>`).join("");
   document.querySelectorAll(".lang-btn").forEach(b=>b.textContent=T()?"EN":"中文");
   document.body.dataset.locale=locale;
 }
 function renderStat(){
   const todo=orders.filter(o=>o.status===1||o.status===2).length;
   const diffOrders=orders.filter(o=>diffStats(o).cnt>0&&o.status!==5).length;
   // 全部 tab 显示「待盘点 N 单 · 有差异 N 单」；其余 tab 只显示「有差异 N 单」
   if(state.tab==="all"){
     $("statBar").innerHTML=T()?`待盘点 <b>${todo}</b> 单 · 有差异 <b>${diffOrders}</b> 单`:`To count <b>${todo}</b> · With diff <b>${diffOrders}</b>`;
   }else{
     $("statBar").innerHTML=T()?`有差异 <b>${diffOrders}</b> 单`:`With diff <b>${diffOrders}</b>`;
   }
 }
 function filtered(){
   const map={review:3,done:4,void:5};const kw=state.kw.trim().toLowerCase();const f=state.filter;
   return orders.filter(o=>{
     if(state.tab==="todo"){if(o.status!==1&&o.status!==2)return false;}
     else if(state.tab!=="all"&&o.status!==map[state.tab])return false;
     if(kw&&!o.no.toLowerCase().includes(kw))return false;
     if(f.type&&o.type!==f.type)return false;
     if(f.whId&&o.warehouseId!==Number(f.whId))return false;
     if(f.start&&o.date<f.start)return false;
     if(f.end&&o.date>f.end)return false;
     return true;
   });
 }
 function cardHtml(o){
   const st=statusMap[o.status],pg=progress(o),df=diffStats(o);
   const scopeRow=o.type==="sample"&&o.scope?`<div class="ib-order-row"><span class="k">${T()?"盘点范围":"Scope"}</span><span class="v">${esc(o.scope)}</span></div>`:"";
   const diffRow=df.cnt>0?`<div class="diff-row"><span class="k">${T()?"差异":"Diff"}</span><span class="v">${df.cnt} ${T()?"条":""}</span></div>`:"";
   return `<div class="ib-order-card" data-id="${o.id}">
     <div class="ib-order-head"><span class="ib-order-no">${o.no}</span><span class="ib-badge ${st.cn}"><span class="dot"></span>${statusZh(o.status)}</span></div>
     <div class="ib-order-row"><span class="k">${T()?"盘点类型":"Type"}</span><span class="v">${T()?typeMeta(o.type).zh:typeMeta(o.type).en}</span></div>
     <div class="ib-order-row"><span class="k">${T()?"库房":"Warehouse"}</span><span class="v">${esc(o.warehouseName)}</span></div>
     ${scopeRow}
     <div class="ib-order-row"><span class="k">${T()?"盘点人":"Counter"}</span><span class="v">${esc(o.counter)}</span></div>
     <div class="prog-row"><span class="k">${T()?"进度":"Progress"}</span><span class="prog-bar"><span class="prog-fill" style="width:${pg.pct}%"></span></span><span class="prog-txt"><b>${pg.done}</b> / ${pg.total}</span></div>
     ${diffRow}
   </div>`;
 }
 function renderList(reset){
   if(reset)state.page=1;
   const rows=filtered();
   if(!rows.length){$("orderList").innerHTML=`<div class="ib-list-empty">📋<div>${T()?"暂无盘点任务":"No tasks"}</div></div>`;return;}
   const shown=rows.slice(0,state.page*PAGE_SIZE);
   let html=shown.map(cardHtml).join("");
   if(shown.length<rows.length)html+=`<div class="list-more">${T()?"上拉加载更多":"Pull to load more"}</div>`;
   else if(rows.length>PAGE_SIZE)html+=`<div class="list-more">${T()?"没有更多了":"No more"}</div>`;
   $("orderList").innerHTML=html;
 }

 function subInfo(l){const parts=[l.category,l.spec].filter(Boolean);if(l.barcode)parts.push((T()?"条码":"Barcode")+" "+l.barcode);return parts.join(" · ");}
 function openDetail(id){
   const o=orders.find(x=>x.id===id);if(!o)return;
   const st=statusMap[o.status],pg=progress(o),df=diffStats(o);
   const showDiff=true; /* 明盘：账面与差异始终展示（不盲盘） */
   $("dNavTitle").textContent=T()?"盘点单详情":"Stocktake Detail";
   $("dOrderNo").textContent=o.no;$("dCopyNo").textContent=T()?"复制":"Copy";
   $("dStatusBadge").className=`ib-badge ${st.cn}`;$("dStatusBadge").textContent=statusZh(o.status);
   $("dBaseTitle").textContent=T()?"基本信息":"Basic Info";
   $("dItemsTitle").textContent=`${T()?"盘点明细":"Items"}（${pg.total}）`;
   $("dLogTitle").textContent=T()?"盘点流水":"Timeline";
   $("dLblKinds").textContent=T()?"盘点SKU":"SKUs";$("dLblDiff").textContent=T()?"有差异":"Diff";$("dLblGain").textContent=T()?"盘盈":"Overage";$("dLblLoss").textContent=T()?"盘亏":"Shortage";
   const rows=[[T()?"盘点类型":"Type",T()?typeMeta(o.type).zh:typeMeta(o.type).en],[T()?"库房":"Warehouse",esc(o.warehouseName)],[T()?"盘点人":"Counter",esc(o.counter)],[T()?"创建时间":"Created",`${o.date} ${o.time}`]];
   if(o.type==="sample"&&o.scope)rows.push([T()?"盘点范围":"Scope",esc(o.scope)]);
   if(o.remark)rows.push([T()?"备注":"Remark",esc(o.remark)]);
   $("dBaseInfo").innerHTML=rows.map(([k,v])=>`<div class="ib-info-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
   $("dItems").innerHTML=o.items.map(l=>{
     const sub=subInfo(l);
     const counted=l.counted!=null;
     const flag=counted?`<span class="ib-ditem-flag counted">✓ ${T()?"已盘":"Counted"}</span>`:`<span class="ib-ditem-flag wait">${T()?"待盘":"Uncounted"}</span>`;
     let cls="ib-ditem",nums="",reason="";
     if(counted&&showDiff){
       const d=l.counted-l.book;
       if(d>0)cls+=" diff-gain";else if(d<0)cls+=" diff-loss";else cls+=" diff-ok";
       const diffTag=d===0?`<span class="diff-tag ok">${T()?"一致":"Match"}</span>`:`<span class="diff-tag ${d>0?"gain":"loss"}">${d>0?(T()?"盘盈 +":"Overage +")+d:(T()?"盘亏 ":"Shortage ")+d}</span>`;
       nums=`<div class="ib-nums"><span>${T()?"实盘":"Counted"} <b>${l.counted}</b></span><span>${T()?"账面":"Book"} ${l.book}</span>${diffTag}</div>`;
       if(d!==0&&l.reason)reason=`<div class="reason-tag">${T()?"原因":"Reason"}：${T()?l.reason:(reasonMap[l.reason]||l.reason)}</div>`;
     }else if(counted){
       nums=`<div class="ib-nums"><span>${T()?"实盘":"Counted"} <b>${l.counted}</b></span><span>${T()?"账面":"Book"} ${l.book}</span></div>`;
     }else{
       nums=`<div class="ib-nums"><span style="color:var(--app-text-muted)">${T()?"尚未盘点":"Not counted"}</span></div>`;
     }
     return `<div class="${cls}"><div class="ib-ditem-top"><div class="ib-ditem-name">${esc(l.name)}</div>${flag}</div>${sub?`<div class="ib-ditem-sub">${esc(sub)}</div>`:""}${nums}${reason}</div>`;
   }).join("");
   $("dSumKinds").textContent=pg.total;
   $("dSumDiff").textContent=showDiff?df.cnt:"—";
   $("dSumGain").textContent=showDiff?"+"+df.gain:"—";
   $("dSumLoss").textContent=showDiff?(df.loss<0?df.loss:"-0"):"—";
   buildLog(o);
   curId=o.id;renderDetailFoot(o);
   $("screen-list").classList.remove("active");$("screen-detail").classList.add("active");
 }
 function buildLog(o){
   const logs=[{icon:"＋",title:T()?"创建 · 账面快照":"Created · snapshot",time:`${o.date} ${o.time}`,who:o.counter,m:false}];
   if(o.status>=2&&o.status!==5)logs.push({icon:"▶",title:T()?"开始盘点":"Counting started",time:`${o.date} ${o.time}`,who:o.counter,m:false});
   if(o.status>=3)logs.push({icon:"✓",title:T()?"提交 · 待复核":"Submitted · review",time:`${o.date} ${o.time}`,who:o.counter,m:false});
   if(o.status===4)logs.push({icon:"✓",title:T()?"复核完成 · 已调账":"Reviewed · adjusted",time:`${o.date} ${o.time}`,who:"WEB 复核",m:false});
   if(o.status===5)logs.push({icon:"✕",title:T()?"作废盘点单":"Voided",time:`${o.date} ${o.time}`,who:o.counter,m:true});
   $("dLog").innerHTML=logs.map((g,i)=>`<div class="ib-log-node"><div class="ib-log-rail"><div class="ib-log-dot${g.m?" muted":""}">${g.icon}</div>${i<logs.length-1?'<div class="ib-log-line"></div>':""}</div><div class="ib-log-body"><div class="ib-log-title">${g.title}</div><div class="ib-log-meta">${g.time} · ${esc(g.who)}</div></div></div>`).join("");
 }
 function closeDetail(){$("screen-detail").classList.remove("active");$("screen-list").classList.add("active");}

 function renderDetailFoot(o){
   const foot=$("detailFoot");
   if(o.status===1){foot.className="detail-foot";foot.innerHTML=`<button class="btn-danger-o" data-act="void">${T()?"作废":"Void"}</button><button class="btn-primary" data-act="count">${T()?"开始盘点":"Start"}</button>`;}
   else if(o.status===2){foot.className="detail-foot";foot.innerHTML=`<button class="btn-danger-o" data-act="void">${T()?"作废":"Void"}</button><button class="btn-primary" data-act="count">${T()?"继续盘点":"Continue"}</button>`;}
   else{foot.className="detail-foot hidden";foot.innerHTML="";}
 }
 function askConfirm(title,desc,okText,danger,cb){$("cfTitle").textContent=title;$("cfDesc").textContent=desc;$("cfCancel").textContent=T()?"取消":"Cancel";const ok=$("cfOk");ok.textContent=okText;ok.className=danger?"ok-danger":"ok-primary";pendingCb=cb;$("confirmMask").classList.add("show");}
 function closeConfirm(){$("confirmMask").classList.remove("show");pendingCb=null;}

 function openFilter(){
   $("flType").innerHTML=[["",T()?"全部":"All"],...stTypes.map(t=>[t.id,T()?t.zh:t.en])].map(([v,l])=>`<button class="fchip ${state.filter.type===v?"on":""}" data-ftype="${v}">${l}</button>`).join("");
   $("flWh").innerHTML=[["",T()?"全部":"All"],...warehouses.map(w=>[String(w.id),w.name])].map(([v,l])=>`<button class="fchip ${String(state.filter.whId)===v?"on":""}" data-fwh="${v}">${l}</button>`).join("");
   $("flStart").value=state.filter.start;$("flEnd").value=state.filter.end;$("filterSheet").classList.add("show");
 }
 function closeFilter(){$("filterSheet").classList.remove("show");}
 function filterActive(){const f=state.filter;return f.type||f.whId||f.start||f.end;}
 function syncFilterDot(){$("filterDot").style.display=filterActive()?"block":"none";$("filterBtn").classList.toggle("on",!!filterActive());}

 document.addEventListener("click",(e)=>{
   if(e.target.closest(".lang-btn")){locale=locale==="zh"?"en":"zh";renderStatic();renderStat();renderList(true);if($("screen-detail").classList.contains("active")&&curId)openDetail(curId);return;}
   if(e.target.closest("#navBack")){goWorkbench();return;}
   if(e.target.closest("#newBtn")){goFeature("create_stocktake","stocktake-create.html");return;}
   const tab=e.target.closest(".ib-tab");if(tab){state.tab=tab.dataset.tab;renderStatic();renderStat();renderList(true);return;}
   if(e.target.closest("#searchBtn")){state.kw=$("searchInput").value;renderList(true);return;}
   if(e.target.closest("#filterBtn")){openFilter();return;}
   if(e.target.closest("#filterClose")||e.target.id==="filterSheet"){closeFilter();return;}
   const ft=e.target.closest("[data-ftype]");if(ft){state.filter.type=ft.dataset.ftype;document.querySelectorAll("[data-ftype]").forEach(x=>x.classList.toggle("on",x===ft));return;}
   const fw=e.target.closest("[data-fwh]");if(fw){state.filter.whId=fw.dataset.fwh;document.querySelectorAll("[data-fwh]").forEach(x=>x.classList.toggle("on",x===fw));return;}
   if(e.target.closest("#filterReset")){state.filter={type:"",whId:"",start:"",end:""};openFilter();return;}
   if(e.target.closest("#filterApply")){state.filter.start=$("flStart").value;state.filter.end=$("flEnd").value;syncFilterDot();closeFilter();renderList(true);return;}
   const card=e.target.closest(".ib-order-card");if(card){openDetail(Number(card.dataset.id));return;}
   if(e.target.closest("#dNavBack")){closeDetail();return;}
   if(e.target.closest("#dCopyNo")){toast(T()?"已复制":"Copied");return;}
   const act=e.target.closest("[data-act]");
   if(act){
     const o=orders.find(x=>x.id===curId);if(!o)return;const a=act.dataset.act;
     if(a==="count"){goCount(o.id);return;}
     if(a==="void"){askConfirm(T()?"作废盘点单":"Void",T()?"作废后该单只读，不可恢复。确认作废？":"Becomes read-only. Confirm?",T()?"作废":"Void",true,()=>{o.status=5;openDetail(o.id);renderStat();renderList(true);toast(T()?"已作废":"Voided");});return;}
     return;
   }
   if(e.target.closest("#cfCancel")||e.target.id==="confirmMask"){closeConfirm();return;}
   if(e.target.closest("#cfOk")){const cb=pendingCb;closeConfirm();if(cb)cb();return;}
 });
 document.addEventListener("input",(e)=>{if(e.target.id==="searchInput"){state.kw=e.target.value;renderList(true);}});
 document.addEventListener("keydown",(e)=>{if(e.target.id==="searchInput"&&e.key==="Enter"){state.kw=e.target.value;renderList(true);}});
 $("orderList").addEventListener("scroll",function(){if(this.scrollTop+this.clientHeight>=this.scrollHeight-24){const rows=filtered();if(state.page*PAGE_SIZE<rows.length){state.page++;renderList(false);}}});

 /* 支持从作业页/新建页带 id 直接进详情 */
 const wantId=params.get("detail");
 renderStatic();renderStat();renderList(true);
 if(wantId)openDetail(Number(wantId));
})();
</script>
