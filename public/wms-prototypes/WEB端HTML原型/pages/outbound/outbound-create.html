<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS-WEB-OUT02 出库管理 · 新建出库单</title>
  <style>
:root {
  --bg:#f5f5f7;--line:rgba(29,29,31,0.08);--text:#1d1d1f;--subtext:rgba(29,29,31,0.72);
  --muted:rgba(29,29,31,0.48);--accent:#00ab95;--accent-soft:rgba(0,171,149,0.10);
  --warn:#c77c11;--danger:#d92d20;
  --radius-xl:20px;--radius-lg:16px;--radius-md:12px;--radius-pill:999px;
  --shadow:0 8px 24px rgba(0,0,0,0.06);
  --font-heading:"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;font-family:var(--font-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;}
a{text-decoration:none;color:inherit;}

/* canvas & page-stack */
.canvas{width:100%;max-width:none;margin:0;padding:20px 20px 34px;box-sizing:border-box;display:grid;gap:20px;}
.page-stack{display:grid;gap:14px;}

/* list-surface */
.list-surface{border-radius:var(--radius-xl);background:rgba(255,255,255,0.96);border:1px solid rgba(255,255,255,0.94);box-shadow:var(--shadow);overflow:hidden;}

/* surface-head */
.surface-head{padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(29,29,31,0.06);background:rgba(255,255,255,0.92);}
.surface-title{margin:0;font-family:var(--font-heading);font-size:22px;line-height:1.14;letter-spacing:-0.045em;font-weight:650;}
.surface-subtitle{color:var(--muted);font-size:12px;margin-top:3px;}

/* back button */
.ib-back-btn{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--subtext);cursor:pointer;padding:6px 10px;border-radius:8px;background:rgba(29,29,31,0.05);border:none;white-space:nowrap;flex-shrink:0;}
.ib-back-btn:hover{background:rgba(29,29,31,0.09);}

/* surface-controls */
.surface-controls{padding:20px 22px;display:grid;gap:16px;background:rgba(255,255,255,0.92);border-bottom:1px solid rgba(29,29,31,0.06);}

/* form sections */
.form-section{background:#fff;border-radius:var(--radius-lg);border:1px solid rgba(29,29,31,0.07);padding:22px;}
.form-section-title{font-size:15px;font-weight:600;color:var(--text);margin:0 0 18px;display:flex;align-items:center;gap:8px;}
.form-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;margin-bottom:14px;}
.form-row:last-child{margin-bottom:0;}
.form-row.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{font-size:13px;font-weight:500;color:var(--text);}
.required{color:#ef4444;margin-left:2px;}
.field-hint{font-size:11px;color:var(--muted);line-height:1.5;}

/* filter-ctrl inputs (matches inbound) */
.filter-ctrl{height:40px;border-radius:12px;border:1px solid rgba(29,29,31,0.08);background:rgba(255,255,255,0.94);padding:0 12px;font-size:13px;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s,background .18s;width:100%;}
select.filter-ctrl{appearance:none;background-image:linear-gradient(45deg,transparent 50%,rgba(29,29,31,0.45) 50%),linear-gradient(135deg,rgba(29,29,31,0.45) 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
.filter-ctrl:hover{border-color:rgba(29,29,31,0.14);background:#fff;}
.filter-ctrl:focus{border-color:rgba(0,171,149,0.62);box-shadow:0 0 0 1px rgba(0,171,149,0.22);background:#fff;}
.filter-ctrl.error{border-color:rgba(217,45,32,0.5);}
.ib-form-textarea{border:1px solid rgba(29,29,31,0.14);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);background:#fafafa;outline:none;width:100%;resize:vertical;min-height:72px;font-family:inherit;}
.ib-form-textarea:focus{border-color:var(--accent);background:#fff;}

/* scan bar (matches inbound) */
.ib-scan-bar{background:rgba(0,171,149,0.06);border:1.5px dashed rgba(0,171,149,0.35);border-radius:14px;padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;}
.ib-scan-icon{width:40px;height:40px;background:rgba(0,171,149,0.12);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib-scan-icon svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ib-scan-body{flex:1;display:flex;flex-direction:column;gap:4px;}
.ib-scan-label{font-size:13px;font-weight:600;color:var(--accent);}
.ib-scan-input{height:44px;border:1.5px solid rgba(0,171,149,0.4);border-radius:10px;padding:0 14px;font-size:14px;color:var(--text);background:#fff;outline:none;width:100%;}
.ib-scan-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,171,149,0.12);}
.ib-scan-hint{font-size:12px;color:var(--muted);}
.ib-scan-feedback{font-size:12px;font-weight:500;min-height:18px;}
.ib-scan-feedback.ok{color:var(--accent);}
.ib-scan-feedback.err{color:#ef4444;}

/* table */
.table-wrap{overflow:hidden;border-radius:14px;border:1px solid rgba(29,29,31,0.05);background:rgba(250,250,252,0.9);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:10px 12px;text-align:left;color:var(--muted);background:rgba(29,29,31,0.02);border-bottom:1px solid rgba(29,29,31,0.05);font-weight:600;font-size:12px;white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(29,29,31,0.04);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover{background:rgba(0,171,149,0.025);}
.td-seq{color:var(--muted);font-size:12px;text-align:center;}
.td-auto{background:rgba(0,171,149,0.04);color:var(--subtext);font-size:12px;border-radius:6px;padding:4px 8px;white-space:nowrap;display:inline-block;}
.td-stock{color:var(--accent);font-size:12px;font-weight:700;}
.td-stock.low{color:var(--warn);}
.td-center{text-align:center;}
.tbl-input{height:34px;border-radius:8px;border:1px solid rgba(29,29,31,0.08);background:rgba(255,255,255,0.96);padding:0 10px;font-size:13px;color:var(--text);outline:none;width:100%;}
.tbl-input:focus{border-color:rgba(0,171,149,0.5);box-shadow:0 0 0 2px rgba(0,171,149,0.08);}
.tbl-input.error{border-color:rgba(217,45,32,0.4);}
.del-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px;}
.del-btn:hover{background:rgba(217,45,32,0.08);color:var(--danger);}
.table-empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px;}

/* items footer row */
.ib-items-footer-row{display:flex;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--subtext);}

/* badge */
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;}
.badge-green{background:rgba(0,171,149,0.12);color:var(--accent);}
.badge-grey{background:rgba(29,29,31,0.06);color:var(--subtext);}

/* error banner */
.alert-err{background:rgba(217,45,32,0.07);border:1px solid rgba(217,45,32,0.14);color:#991b1b;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:10px;}

/* ib-footer (inline, not fixed) */
.ib-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:#fff;border-top:1px solid rgba(29,29,31,0.06);padding:16px 24px;}
.ib-footer-note{font-size:12px;color:var(--muted);margin-right:auto;}

/* buttons */
.accent-btn{height:40px;border-radius:999px;border:1px solid rgba(0,171,149,0.40);background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;font-size:13px;font-weight:650;letter-spacing:-0.01em;cursor:pointer;box-shadow:0 8px 20px rgba(0,171,149,0.18);}
.accent-btn:hover{filter:brightness(0.97);}
.neutral-btn{height:40px;border-radius:999px;border:1px solid rgba(29,29,31,0.12);background:rgba(255,255,255,0.94);color:rgba(29,29,31,0.82);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-size:13px;font-weight:650;letter-spacing:-0.01em;cursor:pointer;transition:background .18s,border-color .18s;}
.neutral-btn:hover{background:#fff;border-color:rgba(29,29,31,0.18);}
.warn-btn{height:40px;border-radius:999px;border:1px solid rgba(199,124,17,0.4);background:var(--warn);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;font-size:13px;font-weight:650;cursor:pointer;}

/* modal */
.modal-mask{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,0.30);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:24px;box-shadow:0 32px 72px rgba(0,0,0,0.14);width:min(400px,90vw);padding:28px;display:grid;gap:16px;}
.modal-title{margin:0;font-size:18px;font-weight:700;}
.modal-body{font-size:14px;color:var(--subtext);line-height:1.75;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;}

.footer-note{text-align:center;padding:10px;color:rgba(29,29,31,0.2);font-size:11px;}
  </style>
</head>
<body>
<div class="canvas">
  <div class="page-stack">
    <section class="list-surface">

      <!-- 表头 -->
      <div class="surface-head">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="ib-back-btn" onclick="goBack()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            出库单管理
          </button>
          <div>
            <h1 class="surface-title" id="page-title">新建出库单</h1>
            <p class="surface-subtitle">WMS-WEB-OUT02 · 仅支持调拨出库 / 报损出库 / 其他出库</p>
          </div>
        </div>
      </div>

      <!-- 表单主体 -->
      <div class="surface-controls">

        <!-- 基本信息 -->
        <div class="form-section">
          <div class="form-section-title">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="3" stroke="var(--accent)" stroke-width="1.5"/><path d="M5 8h6M5 5.5h6M5 10.5h4" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/></svg>
            基本信息
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">出库类型 <span class="required">*</span></label>
              <select class="filter-ctrl" id="f-type" onchange="onTypeChange()">
                <option value="">请选择出库类型</option>
                <option value="调拨出库">调拨出库</option>
                <option value="报损出库">报损出库</option>
                <option value="其他出库">其他出库</option>
              </select>
              <span class="field-hint">销售出库仅由仓库APP自动生成，WEB端不支持手动新建</span>
            </div>
            <div class="form-group">
              <label class="form-label">出库仓库 <span class="required">*</span></label>
              <select class="filter-ctrl" id="f-wh" onchange="onWarehouseChange()">
                <option value="">请选择出库仓库</option>
                <option value="1号仓库">1号仓库</option>
                <option value="2号仓库">2号仓库</option>
                <option value="3号仓库">3号仓库</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">出库库房 <span class="required">*</span></label>
              <select class="filter-ctrl" id="f-room">
                <option value="">请选择出库库房</option>
                <option value="常温主库">常温主库</option>
                <option value="冷藏专区">冷藏专区</option>
                <option value="综合库房">综合库房</option>
                <option value="主库房">主库房</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">来源单号</label>
              <input class="filter-ctrl" id="f-src" placeholder="调拨单 / 报损单编号（选填）" maxlength="64" />
            </div>
          </div>
          <div class="form-row cols-2">
            <div class="form-group">
              <label class="form-label">出库原因</label>
              <textarea class="ib-form-textarea" id="f-reason" placeholder="报损/其他出库建议填写，最长200字符" maxlength="200"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">备注</label>
              <textarea class="ib-form-textarea" id="f-remark" placeholder="出库备注说明，最长200字符" maxlength="200"></textarea>
            </div>
          </div>
        </div>

        <!-- 商品明细 -->
        <div class="form-section">
          <div class="form-section-title">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h8" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/></svg>
            商品明细
            <span id="row-badge" class="badge badge-grey" style="font-weight:700;">0 行</span>
          </div>

          <!-- 扫码栏 -->
          <div class="ib-scan-bar">
            <div class="ib-scan-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2M19 15v2M15 19h6"/></svg>
            </div>
            <div class="ib-scan-body">
              <span class="ib-scan-label">扫码 / 手动输入条形码</span>
              <input class="ib-scan-input" id="scan-input" placeholder="扫描或输入商品条形码，按 Enter 添加" autocomplete="off" />
              <span class="ib-scan-feedback" id="scan-result"></span>
            </div>
            <button class="accent-btn" style="height:36px;padding:0 16px;font-size:12px;" onclick="handleScan()">添加</button>
          </div>

          <!-- 明细表格 -->
          <div class="table-wrap" id="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:40px;text-align:center;">序</th>
                  <th style="min-width:140px;">商品条形码</th>
                  <th style="min-width:120px;">SKU编码</th>
                  <th style="min-width:160px;">商品名称</th>
                  <th style="width:80px;">规格</th>
                  <th style="width:60px;">单位</th>
                  <th style="width:100px;">出库数量 <span class="required">*</span></th>
                  <th style="width:120px;">批次号</th>
                  <th style="width:90px;text-align:center;">当前可用</th>
                  <th style="width:48px;text-align:center;">删</th>
                </tr>
              </thead>
              <tbody id="detail-tbody">
                <tr id="empty-row">
                  <td colspan="10">
                    <div class="table-empty">📋 请扫描商品条形码或点击「添加」开始录入出库商品</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="ib-items-footer-row">
            <span style="color:var(--muted);font-size:12px;">出库仓库选择后将自动展示可用库存</span>
          </div>

          <div id="err-banner" class="alert-err" style="display:none;margin-top:10px;"></div>
        </div>

      </div><!-- /surface-controls -->

      <!-- 底部操作栏 (inline) -->
      <div class="ib-footer">
        <span class="ib-footer-note">共 <strong id="row-count">0</strong> 行商品 · 合计出库 <strong id="total-qty">0</strong> 件</span>
        <button class="neutral-btn" onclick="goBack()">取消</button>
        <button class="warn-btn" onclick="saveDraft()">保存草稿</button>
        <button class="accent-btn" onclick="askSubmit()">提交出库</button>
      </div>

    </section>
  </div>
</div><!-- /canvas -->

<!-- 提交确认 modal -->
<div class="modal-mask" id="modal-submit">
  <div class="modal">
    <h3 class="modal-title">确认提交出库？</h3>
    <p class="modal-body">提交后系统将立即执行库存扣减，<strong>操作不可撤销</strong>。若库存不足将转为「出库失败」并记录原因。</p>
    <div class="modal-foot">
      <button class="neutral-btn" onclick="closeModal()">取消</button>
      <button class="accent-btn" onclick="doSubmit()">确认提交</button>
    </div>
  </div>
</div>

<script>
/* ─── 模拟商品库 ─── */
const PRODUCTS = {
  '6901234560001': {sku:'SKU-00101',name:'农夫山泉 550ml',spec:'550ml/瓶',unit:'瓶',stock:{'':{1:28,2:12,3:0}}},
  '6901234560002': {sku:'SKU-00102',name:'可口可乐 330ml',spec:'330ml/罐',unit:'罐',stock:{'':{1:150,2:80,3:40}}},
  '6901234560003': {sku:'SKU-00103',name:'统一方便面 红烧牛肉',spec:'103g/包',unit:'包',stock:{'':{1:200,2:0,3:60}}},
  '6901234560004': {sku:'SKU-00104',name:'蒙牛纯牛奶 250ml',spec:'250ml/盒',unit:'盒',stock:{'':{1:96,2:48,3:24}}},
  '6901234560005': {sku:'SKU-00105',name:'卫龙辣条 大刀肉',spec:'100g/袋',unit:'袋',stock:{'':{1:5,2:20,3:10}}},
};

let rows = [];
let rowId = 0;

// 获取当前仓库编号
function getWhNum() {
  const wh = document.getElementById('f-wh').value;
  const m = wh.match(/(\d)/);
  return m ? parseInt(m[1]) : null;
}

function getStock(barcode, batch) {
  const p = PRODUCTS[barcode];
  if (!p) return null;
  const whNum = getWhNum();
  if (!whNum) return null;
  const b = batch||'';
  return (p.stock[b]||p.stock['']||{})[whNum] ?? null;
}

function onWarehouseChange() { rows.forEach(r => updateStockDisplay(r.id)); }
function onTypeChange() { /* could add type-specific hints */ }

function updateStockDisplay(id) {
  const row = rows.find(r=>r.id===id);
  if (!row) return;
  const el = document.getElementById(`stock-${id}`);
  if (!el) return;
  const s = getStock(row.barcode, row.batch);
  if (s===null) { el.textContent='—'; el.className='td-stock'; return; }
  el.textContent = s;
  el.className = s < 10 ? 'td-stock low' : 'td-stock';
}

function addRow(barcode, product) {
  const id = ++rowId;
  const whNum = getWhNum();
  const stock = product ? (getStock(barcode,'')||'—') : '—';
  const row = { id, barcode, sku:product?.sku||'', name:product?.name||'', spec:product?.spec||'', unit:product?.unit||'', qty:'', batch:'' };
  rows.push(row);

  const emptyRow = document.getElementById('empty-row');
  if (emptyRow) emptyRow.remove();

  const tbody = document.getElementById('detail-tbody');
  const tr = document.createElement('tr');
  tr.id = `row-${id}`;
  tr.innerHTML = `
    <td class="td-seq">${rows.length}</td>
    <td><input class="tbl-input" id="bc-${id}" value="${barcode}" placeholder="条形码" onchange="onBarcodeChange(${id})" style="min-width:130px;" /></td>
    <td><span class="td-auto" id="sku-${id}">${row.sku||'<span style=color:var(--muted)>未识别</span>'}</span></td>
    <td><span class="td-auto" id="name-${id}" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;">${row.name||'<input class="tbl-input" placeholder="手动填写商品名称" style="min-width:140px;" />'}</span></td>
    <td><span class="td-auto" id="spec-${id}">${row.spec||'—'}</span></td>
    <td><span class="td-auto" id="unit-${id}">${row.unit||'—'}</span></td>
    <td><input class="tbl-input" id="qty-${id}" type="number" min="1" placeholder="数量" value="${row.qty}" oninput="onQtyChange(${id})" style="width:88px;" /></td>
    <td><input class="tbl-input" id="batch-${id}" placeholder="批次号（选填）" value="${row.batch}" oninput="onBatchChange(${id})" style="min-width:110px;" /></td>
    <td class="td-center"><span class="td-stock" id="stock-${id}">${stock}</span></td>
    <td class="td-center"><button class="del-btn" onclick="delRow(${id})" title="删除此行">✕</button></td>`;
  tbody.appendChild(tr);
  updateFooter();
}

function onBarcodeChange(id) {
  const barcode = document.getElementById(`bc-${id}`).value.trim();
  const row = rows.find(r=>r.id===id);
  if (!row) return;
  row.barcode = barcode;
  const p = PRODUCTS[barcode];
  if (p) {
    row.sku=p.sku; row.name=p.name; row.spec=p.spec; row.unit=p.unit;
    document.getElementById(`sku-${id}`).textContent  = p.sku;
    document.getElementById(`name-${id}`).textContent = p.name;
    document.getElementById(`spec-${id}`).textContent = p.spec;
    document.getElementById(`unit-${id}`).textContent = p.unit;
  }
  updateStockDisplay(id);
}

function onQtyChange(id) {
  const row = rows.find(r=>r.id===id);
  if (row) { row.qty = parseInt(document.getElementById(`qty-${id}`).value)||0; }
  updateFooter();
}

function onBatchChange(id) {
  const row = rows.find(r=>r.id===id);
  if (row) { row.batch = document.getElementById(`batch-${id}`).value; updateStockDisplay(id); }
}

function delRow(id) {
  rows = rows.filter(r=>r.id!==id);
  document.getElementById(`row-${id}`)?.remove();
  if (!rows.length) {
    const tbody = document.getElementById('detail-tbody');
    tbody.innerHTML = `<tr id="empty-row"><td colspan="10"><div class="table-empty">📋 请扫描商品条形码或点击「添加」开始录入出库商品</div></td></tr>`;
  } else {
    // 重排序号
    rows.forEach((r,i)=>{ const el=document.querySelector(`#row-${r.id} .td-seq`); if(el) el.textContent=i+1; });
  }
  updateFooter();
}

function handleScan() {
  const input = document.getElementById('scan-input');
  const barcode = input.value.trim();
  if (!barcode) return;

  const resultEl = document.getElementById('scan-result');

  // 格式校验
  if (barcode.length < 6 || barcode.length > 20) {
    resultEl.className='ib-scan-feedback err';
    resultEl.textContent = '❌ 条形码格式不正确（应为 6-20 位数字或字母数字组合）';
    return;
  }

  // 仓库校验
  if (!document.getElementById('f-wh').value) {
    resultEl.className='ib-scan-feedback err';
    resultEl.textContent = '❌ 请先选择出库仓库';
    return;
  }

  const product = PRODUCTS[barcode];
  if (product) {
    resultEl.className='ib-scan-feedback ok';
    const s = getStock(barcode,'');
    resultEl.textContent = `✅ 已添加：${product.name} ${product.spec}，当前可用库存 ${s!==null?s:'—'}`;
  } else {
    resultEl.className='ib-scan-feedback err';
    resultEl.textContent = '⚠️ 条码未找到，已插入空行，请手动填写 SKU 编码和商品名称';
  }

  addRow(barcode, product||null);
  input.value = '';
  setTimeout(()=>{ if(resultEl.className.includes('ok')) resultEl.textContent=''; }, 3000);
}

document.getElementById('scan-input').addEventListener('keydown', e=>{ if(e.key==='Enter') handleScan(); });

function updateFooter() {
  const count = rows.length;
  const total = rows.reduce((s,r)=>s+(parseInt(r.qty)||0), 0);
  document.getElementById('row-count').textContent = count;
  document.getElementById('total-qty').textContent  = total;
  document.getElementById('row-badge').textContent  = `${count} 行`;
  document.getElementById('row-badge').className    = count>0 ? 'badge badge-green' : 'badge badge-grey';
}

function validate() {
  const errors = [];
  if (!document.getElementById('f-type').value) errors.push('请选择出库类型');
  if (!document.getElementById('f-wh').value)   errors.push('请选择出库仓库');
  if (!document.getElementById('f-room').value)  errors.push('请选择出库库房');
  if (!rows.length) errors.push('请添加至少一条出库商品');
  rows.forEach((r,i)=>{
    const qtyEl = document.getElementById(`qty-${r.id}`);
    const qty = parseInt(qtyEl?.value||'0');
    if (!qty || qty<1) {
      errors.push(`第 ${i+1} 行出库数量必须为正整数`);
      qtyEl?.classList.add('error');
    } else {
      qtyEl?.classList.remove('error');
    }
    const stock = getStock(r.barcode, r.batch);
    if (stock!==null && qty > stock) {
      errors.push(`第 ${i+1} 行出库数量（${qty}）超过可用库存（${stock}）`);
    }
  });
  return errors;
}

function showErrors(errors) {
  const el = document.getElementById('err-banner');
  if (!errors.length) { el.style.display='none'; return; }
  el.style.display='block';
  el.innerHTML = '⚠️ 提交失败，请检查以下问题：<ul style="margin:6px 0 0;padding-left:18px;">'
    + errors.map(e=>`<li>${e}</li>`).join('') + '</ul>';
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function askSubmit() {
  const errors = validate();
  if (errors.length) { showErrors(errors); return; }
  showErrors([]);
  document.getElementById('modal-submit').classList.add('show');
}

function doSubmit() {
  closeModal();
  // 模拟跳转到详情页（已完成态）
  const params = new URLSearchParams({no:'OUT-20240601-NEW001',status:'已完成'});
  window.location.href = `./outbound-detail.html?${params}`;
}

function saveDraft() {
  alert('草稿已保存\n（原型演示）\n出库单号：OUT-20240601-DRAFT01');
}

function goBack() {
  if (rows.length > 0) {
    if (!confirm('当前填写内容未保存，确认离开？')) return;
  }
  window.location.href = '../outbound.html';
}

function closeModal() {
  document.querySelectorAll('.modal-mask').forEach(m=>m.classList.remove('show'));
}

document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModal(); }));

// 通知父级 shell 高亮出库管理菜单
try { window.parent.postMessage({type:'wms-content-ready',pageKey:'outbound'},'*'); } catch(e) {}

// 检查URL参数（编辑草稿模式）
const urlParams = new URLSearchParams(window.location.search);
const editNo = urlParams.get('no');
if (editNo) {
  document.getElementById('page-title').textContent = '编辑出库单';
  document.querySelector('.page-meta').textContent = `编辑草稿 · ${editNo}`;
  // 模拟加载草稿数据
  document.getElementById('f-type').value = '其他出库';
  document.getElementById('f-wh').value   = '3号仓库';
  document.getElementById('f-room').value = '主库房';
  document.getElementById('f-remark').value = '盘点差异补录';
}
</script>
</body>
</html>
