 const esc=(s)=>String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const money=(n)=>`RM ${Number(n||0).toFixed(2)}`;
 const typeMeta=(id)=>inboundTypes.find(t=>t.id===id)||inboundTypes[0];
 const T=()=>locale==="zh";

 /* —— 导航契约（与现有原型一致） —— */
 function carryQuery(extra){const q=new URLSearchParams(location.search);q.set("locale",locale);if(extra)Object.entries(extra).forEach(([k,v])=>q.set(k,v));return q.toString();}
 function goWorkbench(){if(isEmbedded)window.parent.postMessage({type:"wms-navigate",route:"workbench"},"*");else location.href="workbench.html?"+carryQuery();}
 function goFeature(menuId,page,extra){if(isEmbedded)window.parent.postMessage({type:"wms-navigate",route:"feature",menuId},"*");else location.href=page+"?"+carryQuery(extra);}
 function goEdit(id){try{localStorage.setItem("wms_inbound_edit",String(id));}catch(e){}goFeature("create_inbound","inbound-create.html",{edit:id});}

 const state={tab:"all",kw:"",page:1,filter:{type:"",whId:"",start:"",end:""}};
 let curId=null,pendingCb=null;

 function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),1500);}
 function statusZh(s){const m=statusMap[s];return T()?m.zh:m.en;}
 function orderTotals(o){return{kinds:o.items.length,qty:o.items.reduce((s,l)=>s+l.qty,0),amount:o.items.reduce((s,l)=>s+l.amount,0)};}

 function renderStatic(){
   $("navTitle").textContent=T()?"入库单":"Inbound";
   $("searchInput").placeholder=T()?"搜索入库单号":"Search order no.";
   $("newBtn").textContent="＋ "+(T()?"新建":"New");
   $("filterTitle").textContent=T()?"筛选":"Filter";
   $("flbType").textContent=T()?"入库类型":"Type";$("flbWh").textContent=T()?"库房":"Warehouse";$("flbDate").textContent=T()?"入库时间":"Inbound Time";
   $("filterReset").textContent=T()?"重置":"Reset";$("filterApply").textContent=T()?"确定":"Apply";
   const tabs=[["all",T()?"全部":"All"],["draft",T()?"草稿":"Draft"],["done",T()?"已入库":"Inbound"],["void",T()?"已作废":"Voided"]];
   $("tabs").innerHTML=tabs.map(([k,l])=>`<div class="ib-tab ${k===state.tab?"on":""}" data-tab="${k}">${l}</div>`).join("");
   document.querySelectorAll(".lang-btn").forEach(b=>b.textContent=T()?"EN":"中文");
   document.body.dataset.locale=locale;
 }
 function renderStat(){$("statBar").innerHTML=T()?`今日入库 <b>${listStats.todayDone}</b> 单 · 草稿 <b>${listStats.draft}</b>`:`Today <b>${listStats.todayDone}</b> done · Draft <b>${listStats.draft}</b>`;}

 function filtered(){
   const map={draft:1,done:2,void:3};const kw=state.kw.trim().toLowerCase();const f=state.filter;
   return orders.filter(o=>{
     if(state.tab!=="all"&&o.status!==map[state.tab])return false;
     if(kw&&!o.no.toLowerCase().includes(kw))return false;
     if(f.type&&o.type!==f.type)return false;
     if(f.whId&&o.warehouseId!==Number(f.whId))return false;
     if(f.start&&o.date<f.start)return false;
     if(f.end&&o.date>f.end)return false;
     return true;
   });
 }
 function cardHtml(o){
   const st=statusMap[o.status],tt=orderTotals(o);
   const remarkRow=o.remark?`<div class="ib-order-row"><span class="k">${T()?"备注":"Remark"}</span><span class="v">${esc(o.remark)}</span></div>`:"";
   return `<div class="ib-order-card" data-id="${o.id}">
     <div class="ib-order-head"><span class="ib-order-no">${o.no}</span><span class="ib-badge ${st.className}">${statusZh(o.status)}</span></div>
     <div class="ib-order-row"><span class="k">${T()?"入库类型":"Type"}</span><span class="v">${T()?typeMeta(o.type).zh:typeMeta(o.type).en}</span></div>
     <div class="ib-order-row"><span class="k">${T()?"库房":"Warehouse"}</span><span class="v">${esc(o.warehouseName)}</span></div>
     <div class="ib-order-row"><span class="k">${T()?"入库时间":"Time"}</span><span class="v">${o.date} ${o.time}</span></div>
     <div class="ib-order-row"><span class="k">${T()?"商品数量":"Items"}</span><span class="v">${T()?`${tt.kinds}（共 ${tt.qty} 件）`:`${tt.kinds} kinds (${tt.qty} pcs)`}</span></div>
     ${remarkRow}
     <div class="ib-order-foot"><span></span><span class="ib-order-amount ${tt.amount>0?"":"zero"}">${money(tt.amount)}</span></div>
   </div>`;
 }
 function renderList(reset){
   if(reset)state.page=1;
   const rows=filtered();
   if(!rows.length){$("orderList").innerHTML=`<div class="ib-list-empty">📦<div>${T()?"没有符合条件的入库单":"No matching orders"}</div></div>`;return;}
   const shown=rows.slice(0,state.page*PAGE_SIZE);
   let html=shown.map(cardHtml).join("");
   if(shown.length<rows.length)html+=`<div class="list-more">${T()?"上拉加载更多":"Pull to load more"}</div>`;
   else if(rows.length>PAGE_SIZE)html+=`<div class="list-more">${T()?"没有更多了":"No more"}</div>`;
   $("orderList").innerHTML=html;
 }

 function subInfo(l){const parts=[l.brand,l.category,l.spec,l.unit].filter(Boolean);if(l.barcode)parts.push((T()?"条码":"Barcode")+" "+l.barcode);return parts.join(" · ");}
 function openDetail(id){
   const o=orders.find(x=>x.id===id);if(!o)return;
   const st=statusMap[o.status],tt=orderTotals(o);
   $("dNavTitle").textContent=T()?"入库单详情":"Inbound Detail";
   $("dOrderNo").textContent=o.no;$("dCopyNo").textContent=T()?"复制":"Copy";
   $("dStatusBadge").className=`ib-badge ${st.className}`;$("dStatusBadge").textContent=statusZh(o.status);
   $("dBaseTitle").textContent=T()?"基本信息":"Basic Info";
   $("dItemsTitle").textContent=`${T()?"入库明细":"Items"}（${tt.kinds}）`;
   $("dLogTitle").textContent=T()?"入库流水":"Timeline";
   $("dLblKinds").textContent=T()?"种":"kinds";$("dLblQty").textContent=T()?"件":"pcs";$("dLblAmount").textContent=T()?"合计金额":"Total";
   const rows=[[T()?"入库类型":"Type",T()?typeMeta(o.type).zh:typeMeta(o.type).en],[T()?"库房":"Warehouse",esc(o.warehouseName)],[T()?"入库时间":"Time",`${o.date} ${o.time}`]];
   if(o.remark)rows.push([T()?"备注":"Remark",esc(o.remark)]);
   $("dBaseInfo").innerHTML=rows.map(([k,v])=>`<div class="ib-info-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
   $("dItems").innerHTML=o.items.map(l=>{
     const sub=subInfo(l);
     const expiry=l.expiry?`<div class="ib-ditem-tag">${T()?"有效期":"Expiry"} ${l.expiry}</div>`:"";
     const qtyLine=l.price>0?`${T()?"数量":"Qty"}：<b>${l.qty}</b> × ${money(l.price)}`:`${T()?"数量":"Qty"}：<b>${l.qty}</b>`;
     const amt=l.amount>0?`<div class="ib-ditem-amt">${money(l.amount)}</div>`:"";
     return `<div class="ib-ditem"><div class="ib-ditem-top"><div class="ib-ditem-name">${esc(l.name)}</div>${amt}</div>${sub?`<div class="ib-ditem-sub">${esc(sub)}</div>`:""}${expiry}<div class="ib-ditem-qty">${qtyLine}</div></div>`;
   }).join("");
   $("dSumKinds").textContent=tt.kinds;$("dSumQty").textContent=tt.qty;$("dSumAmount").textContent=money(tt.amount);
   const logs=[{icon:"＋",title:T()?"创建入库单":"Created",time:`${o.date} ${o.time}`,who:o.creator}];
   if(o.status===2)logs.push({icon:"✓",title:T()?"提交入库 · 库存入账":"Submitted · stocked",time:`${o.date} ${o.time}`,who:o.creator});
   if(o.status===3)logs.push({icon:"✕",title:T()?"作废入库单":"Voided",time:`${o.date} ${o.time}`,who:o.creator});
   $("dLog").innerHTML=logs.map((g,i)=>`<div class="ib-log-node"><div class="ib-log-rail"><div class="ib-log-dot">${g.icon}</div>${i<logs.length-1?'<div class="ib-log-line"></div>':""}</div><div class="ib-log-body"><div class="ib-log-title">${g.title}</div><div class="ib-log-meta">${g.time} · ${esc(g.who)}</div></div></div>`).join("");
   curId=o.id;renderDetailFoot(o);
   $("screen-list").classList.remove("active");$("screen-detail").classList.add("active");
 }
 function closeDetail(){$("screen-detail").classList.remove("active");$("screen-list").classList.add("active");}

 function renderDetailFoot(o){
   const foot=$("detailFoot");
   if(o.status===1){foot.className="detail-foot";foot.innerHTML=`<button class="btn-danger-o" data-act="del">${T()?"删除":"Delete"}</button><button class="btn-ghost" data-act="edit">${T()?"编辑":"Edit"}</button><button class="btn-primary" data-act="submit">${T()?"提交入库":"Submit"}</button>`;}
   else if(o.status===2){foot.className="detail-foot";foot.innerHTML=`<button class="btn-danger-o" data-act="void">${T()?"作废":"Void"}</button>`;}
   else{foot.className="detail-foot hidden";foot.innerHTML="";}
 }
 function askConfirm(title,desc,okText,danger,cb){$("cfTitle").textContent=title;$("cfDesc").textContent=desc;$("cfCancel").textContent=T()?"取消":"Cancel";const ok=$("cfOk");ok.textContent=okText;ok.className=danger?"ok-danger":"ok-primary";pendingCb=cb;$("confirmMask").classList.add("show");}
 function closeConfirm(){$("confirmMask").classList.remove("show");pendingCb=null;}

 function openFilter(){
   $("flType").innerHTML=[["",T()?"全部":"All"],...inboundTypes.map(t=>[t.id,T()?t.zh:t.en])].map(([v,l])=>`<button class="fchip ${state.filter.type===v?"on":""}" data-ftype="${v}">${l}</button>`).join("");
   $("flWh").innerHTML=[["",T()?"全部":"All"],...warehouses.map(w=>[String(w.id),w.name])].map(([v,l])=>`<button class="fchip ${String(state.filter.whId)===v?"on":""}" data-fwh="${v}">${l}</button>`).join("");
   $("flStart").value=state.filter.start;$("flEnd").value=state.filter.end;$("filterSheet").classList.add("show");
 }
 function closeFilter(){$("filterSheet").classList.remove("show");}
 function filterActive(){const f=state.filter;return f.type||f.whId||f.start||f.end;}
 function syncFilterDot(){$("filterDot").style.display=filterActive()?"block":"none";$("filterBtn").classList.toggle("on",!!filterActive());}

 document.addEventListener("click",(e)=>{
   if(e.target.closest(".lang-btn")){locale=locale==="zh"?"en":"zh";renderStatic();renderStat();renderList(true);return;}
   if(e.target.closest("#navBack")){goWorkbench();return;}
   if(e.target.closest("#newBtn")){goFeature("create_inbound","inbound-create.html");return;}
   const tab=e.target.closest(".ib-tab");if(tab){state.tab=tab.dataset.tab;renderStatic();renderList(true);return;}
   if(e.target.closest("#searchBtn")){state.kw=$("searchInput").value;renderList(true);return;}
   if(e.target.closest("#filterBtn")){openFilter();return;}
   if(e.target.closest("#filterClose")||e.target.id==="filterSheet"){closeFilter();return;}
   const ft=e.target.closest("[data-ftype]");if(ft){state.filter.type=ft.dataset.ftype;document.querySelectorAll("[data-ftype]").forEach(x=>x.classList.toggle("on",x===ft));return;}
   const fw=e.target.closest("[data-fwh]");if(fw){state.filter.whId=fw.dataset.fwh;document.querySelectorAll("[data-fwh]").forEach(x=>x.classList.toggle("on",x===fw));return;}
   if(e.target.closest("#filterReset")){state.filter={type:"",whId:"",start:"",end:""};openFilter();return;}
   if(e.target.closest("#filterApply")){state.filter.start=$("flStart").value;state.filter.end=$("flEnd").value;syncFilterDot();closeFilter();renderList(true);return;}
   const card=e.target.closest(".ib-order-card");if(card){openDetail(Number(card.dataset.id));return;}
   if(e.target.closest("#dNavBack")){closeDetail();return;}
   if(e.target.closest("#dCopyNo")){toast(T()?"已复制":"Copied");return;}
   const act=e.target.closest("[data-act]");
   if(act){
     const o=orders.find(x=>x.id===curId);if(!o)return;const a=act.dataset.act;
     if(a==="edit"){goEdit(o.id);return;}
     if(a==="submit"){askConfirm(T()?"提交入库":"Submit",T()?"提交后库存入账，不可撤销。确认提交？":"Stock will be updated. Confirm?",T()?"提交":"Submit",false,()=>{o.status=2;listStats.draft=Math.max(0,listStats.draft-1);listStats.todayDone++;openDetail(o.id);renderStat();renderList(true);toast(T()?"已提交入库":"Submitted");});return;}
     if(a==="void"){askConfirm(T()?"作废入库单":"Void",T()?"作废后该单只读，不可恢复。确认作废？":"Order becomes read-only. Confirm?",T()?"作废":"Void",true,()=>{o.status=3;openDetail(o.id);renderList(true);toast(T()?"已作废":"Voided");});return;}
     if(a==="del"){askConfirm(T()?"删除草稿":"Delete Draft",T()?"删除后不可恢复。确认删除？":"Cannot be undone. Confirm?",T()?"删除":"Delete",true,()=>{const i=orders.findIndex(x=>x.id===o.id);if(i>-1)orders.splice(i,1);listStats.draft=Math.max(0,listStats.draft-1);closeConfirm();closeDetail();renderStat();renderList(true);toast(T()?"已删除":"Deleted");});return;}
     return;
   }
   if(e.target.closest("#cfCancel")||e.target.id==="confirmMask"){closeConfirm();return;}
   if(e.target.closest("#cfOk")){const cb=pendingCb;closeConfirm();if(cb)cb();return;}
 });
 document.addEventListener("input",(e)=>{if(e.target.id==="searchInput"){state.kw=e.target.value;renderList(true);}});
 document.addEventListener("keydown",(e)=>{if(e.target.id==="searchInput"&&e.key==="Enter"){state.kw=e.target.value;renderList(true);}});
 $("orderList").addEventListener("scroll",function(){if(this.scrollTop+this.clientHeight>=this.scrollHeight-24){const rows=filtered();if(state.page*PAGE_SIZE<rows.length){state.page++;renderList(false);}}});

 renderStatic();renderStat();renderList(true);
})();
</script>
</body>
</html>
