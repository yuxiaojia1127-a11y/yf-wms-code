<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS APP 功能页</title>
  <style>
    * { box-sizing: border-box; }

    body.content-page {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: #1f2329;
      background: radial-gradient(circle at top left, #f7fbff 0, #eef2f7 38%, #e8edf5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .feature-page {
      width: 388px;
      max-width: 100%;
      min-height: 100vh;
      padding: 0 16px 18px;
      background: linear-gradient(180deg, #d7faf0 0, #eef5f2 100px, #eef2f7 100px, #eef2f7 100%);
    }

    .feature-header {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 8px 0 12px;
    }

    .feature-back {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.82);
      color: #3b4353;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(31, 35, 41, 0.06);
    }

    .feature-title-wrap { min-width: 0; }

    .feature-title {
      font-size: 20px;
      line-height: 1.2;
      font-weight: 800;
      color: #18212f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feature-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #687386;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feature-hero,
    .feature-list-item {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(241, 244, 249, 0.95);
      border-radius: 20px;
      box-shadow: 0 10px 26px rgba(31, 35, 41, 0.05);
    }

    .feature-hero { padding: 16px; }

    .feature-hero-top,
    .replica-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .replica-card-head { justify-content: flex-start; }

    .replica-card-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(180deg, #31c5c6 0%, #14aaa8 100%);
      flex: 0 0 auto;
    }

    .replica-card-title {
      font-size: 17px;
      font-weight: 800;
      color: #1b2432;
      line-height: 1;
    }

    .icon-svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .replica-card-icon .icon-svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    .feature-code {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      background: rgba(0, 171, 149, 0.1);
      color: #00ab95;
      font-size: 11px;
      font-weight: 800;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .feature-desc {
      margin-top: 12px;
      color: #566276;
      font-size: 13px;
      line-height: 1.65;
    }

    .feature-stat-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .feature-stat {
      border-radius: 16px;
      background: #f6f8fb;
      border: 1px solid #edf1f6;
      padding: 13px;
    }

    .feature-stat-label,
    .feature-item-meta {
      font-size: 11px;
      color: #7e889a;
    }

    .feature-stat-value {
      margin-top: 8px;
      font-size: 24px;
      line-height: 1;
      font-weight: 900;
      color: #18212f;
    }

    .feature-list {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    .feature-list-item {
      padding: 13px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .feature-item-title {
      font-size: 13px;
      font-weight: 800;
      color: #212937;
      line-height: 1.35;
    }

    .feature-item-meta {
      margin-top: 5px;
      line-height: 1.45;
    }

    .feature-item-status {
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: #eef4ff;
      color: #2a69ff;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <link rel="stylesheet" href="../assets/wms-app.css">
</head>
<body class="content-page" data-page="feature" data-locale="zh">
  <main class="feature-page">
    <header class="feature-header">
      <button class="feature-back" id="featureBack" type="button" aria-label="back">
        <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"></path>
        </svg>
      </button>
      <div class="feature-title-wrap">
        <div class="feature-title" id="featureTitle">库存查询</div>
        <div class="feature-subtitle" id="featureSubtitle">吉隆坡仓库</div>
      </div>
    </header>

    <section class="feature-hero">
      <div class="feature-hero-top">
        <div class="replica-card-head" style="margin-bottom: 0;">
          <span class="replica-card-icon other">
            <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true">
              <rect x="4.5" y="4.5" width="6" height="6" rx="1.5"></rect>
              <rect x="13.5" y="4.5" width="6" height="6" rx="1.5"></rect>
              <rect x="4.5" y="13.5" width="6" height="6" rx="1.5"></rect>
              <rect x="13.5" y="13.5" width="6" height="6" rx="1.5"></rect>
            </svg>
          </span>
          <div class="replica-card-title" id="featureHeroTitle">功能入口</div>
        </div>
        <span class="feature-code" id="featureCode">IV-01</span>
      </div>
      <div class="feature-desc" id="featureDesc">按仓库与货位查看库存</div>

      <div class="feature-stat-grid">
        <div class="feature-stat">
          <div class="feature-stat-label">当前待处理</div>
          <div class="feature-stat-value" id="featureCount">0</div>
        </div>
        <div class="feature-stat">
          <div class="feature-stat-label">已选仓库</div>
          <div class="feature-stat-value" id="featureWarehouseCount">1</div>
        </div>
      </div>
    </section>

    <section class="feature-list" id="featureList"></section>
  </main>

  <script src="../assets/wms-app-data.js"></script>
  <script src="../assets/wms-app-page.js"></script>
</body>
</html>
