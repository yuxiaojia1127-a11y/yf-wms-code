<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS-WEB-OUT03 出库管理 · 出库单详情</title>
  <style>
:root {
  --bg:#f5f5f7;--line:rgba(29,29,31,0.08);--text:#1d1d1f;--subtext:rgba(29,29,31,0.72);
  --muted:rgba(29,29,31,0.48);--accent:#00ab95;--accent-soft:rgba(0,171,149,0.10);
  --warn:#c77c11;--danger:#d92d20;
  --radius-xl:20px;--radius-lg:16px;--radius-md:12px;--radius-pill:999px;
  --shadow:0 8px 24px rgba(0,0,0,0.06);
  --font-heading:"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;font-family:var(--font-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}
button,input,select{font:inherit;}
a{text-decoration:none;color:inherit;}

/* canvas & page-stack */
.canvas{width:100%;max-width:none;margin:0;padding:20px 20px 34px;box-sizing:border-box;display:grid;gap:20px;}
.page-stack{display:grid;gap:14px;}

/* list-surface */
.list-surface{border-radius:var(--radius-xl);background:rgba(255,255,255,0.96);border:1px solid rgba(255,255,255,0.94);box-shadow:var(--shadow);overflow:hidden;}

/* surface-head */
.surface-head{padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid rgba(29,29,31,0.06);background:rgba(255,255,255,0.92);}
.surface-title{margin:0;font-family:var(--font-heading);font-size:22px;line-height:1.14;letter-spacing:-0.045em;font-weight:650;}
.surface-subtitle{color:var(--muted);font-size:12px;margin-top:3px;}

/* back button */
.ib-back-btn{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--subtext);cursor:pointer;padding:6px 10px;border-radius:8px;background:rgba(29,29,31,0.05);border:none;white-space:nowrap;flex-shrink:0;}
.ib-back-btn:hover{background:rgba(29,29,31,0.09);}

/* surface-controls */
.surface-controls{padding:20px 22px;display:grid;gap:16px;background:rgba(255,255,255,0.92);}

/* form sections */
.form-section{background:#fff;border-radius:var(--radius-lg);border:1px solid rgba(29,29,31,0.07);padding:22px;}
.form-section-title{font-size:15px;font-weight:600;color:var(--text);margin:0 0 18px;display:flex;align-items:center;gap:8px;}

/* buttons */
.accent-btn{height:38px;border-radius:999px;border:1px solid rgba(0,171,149,0.40);background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;font-size:13px;font-weight:650;letter-spacing:-0.01em;cursor:pointer;box-shadow:0 6px 16px rgba(0,171,149,0.18);white-space:nowrap;}
.accent-btn:hover{filter:brightness(0.97);}
.neutral-btn{height:38px;border-radius:999px;border:1px solid rgba(29,29,31,0.12);background:rgba(255,255,255,0.94);color:rgba(29,29,31,0.82);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-size:13px;font-weight:650;letter-spacing:-0.01em;cursor:pointer;transition:background .18s,border-color .18s;white-space:nowrap;}
.neutral-btn:hover{background:#fff;border-color:rgba(29,29,31,0.18);}
.danger-btn{height:38px;border-radius:999px;border:1px solid rgba(217,45,32,0.4);background:var(--danger);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap;}
.danger-btn:hover{filter:brightness(0.95);}
.detail-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}

/* pills */
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;white-space:nowrap;}
.pill-default{background:rgba(29,29,31,.06);color:var(--subtext);}
.pill-blue{background:rgba(37,99,235,.10);color:#1d4ed8;}
.pill-green{background:rgba(0,171,149,.12);color:var(--accent);}
.pill-red{background:rgba(217,45,32,.10);color:var(--danger);}
.pill-orange{background:rgba(199,124,17,.12);color:var(--warn);}
.pill-lg{height:28px;padding:0 12px;font-size:13px;}

/* alert */
.alert{padding:14px 18px;border-radius:14px;font-size:13px;line-height:1.75;display:flex;align-items:flex-start;gap:12px;}
.alert-warn{background:rgba(199,124,17,.08);border:1px solid rgba(199,124,17,.14);color:#7a4c0a;}
.alert-info{background:rgba(29,29,31,.04);border:1px solid rgba(29,29,31,.07);color:var(--subtext);}
.alert-fail{background:rgba(217,45,32,.07);border:1px solid rgba(217,45,32,.12);color:#991b1b;}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.alert-body{display:grid;gap:4px;}
.alert-title{font-weight:700;font-size:13px;}
.alert-text{font-size:12px;line-height:1.7;}

/* info grid */
.info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 20px;}
.info-item{display:grid;gap:5px;}
.info-label{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.01em;}
.info-value{font-size:13px;font-weight:600;color:var(--text);line-height:1.5;}
.info-value.mono{font-family:monospace;font-size:12px;}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid rgba(29,29,31,.07);margin-bottom:18px;}
.tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:rgba(0,171,149,.12);color:var(--accent);font-size:11px;font-weight:700;margin-left:5px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* table */
.table-wrap{overflow:hidden;border-radius:14px;border:1px solid rgba(29,29,31,.05);background:rgba(250,250,252,.9);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:9px 12px;text-align:left;color:var(--muted);background:rgba(29,29,31,0.02);border-bottom:1px solid rgba(29,29,31,0.05);font-weight:600;font-size:12px;white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(29,29,31,.04);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover{background:rgba(0,171,149,.02);}
tbody tr.row-fail{background:rgba(217,45,32,.03);}
.td-muted{color:var(--muted);font-size:12px;}
.td-mono{font-family:monospace;font-size:12px;color:var(--subtext);}
.td-center{text-align:center;}

/* gen tag */
.gen-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--subtext);}
.gen-dot{width:6px;height:6px;border-radius:50%;}
.gen-dot.app{background:#6366f1;}
.gen-dot.web{background:var(--accent);}

/* flow type tag */
.flow-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;}
.flow-unfreeze{background:rgba(99,102,241,.10);color:#4338ca;}
.flow-deduct{background:rgba(199,124,17,.10);color:var(--warn);}

/* modal */
.modal-mask{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.30);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:24px;box-shadow:0 32px 72px rgba(0,0,0,.14);width:min(400px,90vw);padding:28px;display:grid;gap:16px;}
.modal-title{margin:0;font-size:18px;font-weight:700;}
.modal-body{font-size:14px;color:var(--subtext);line-height:1.75;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;}
  </style>
</head>
<body>
<div class="canvas" id="canvas">
  <!-- 动态内容由 JS 渲染 -->
</div>

<!-- 取消确认 modal -->
<div class="modal-mask" id="modal-cancel">
  <div class="modal">
    <h3 class="modal-title">确认取消出库单？</h3>
    <p class="modal-body">取消后该草稿出库单将标记为「已取消」，不参与任何库存操作，<strong>此操作不可撤销</strong>。</p>
    <div class="modal-foot">
      <button class="neutral-btn" onclick="closeModal()">再想想</button>
      <button class="danger-btn" onclick="doCancel()">确认取消</button>
    </div>
  </div>
</div>

<!-- 重新提交 modal -->
<div class="modal-mask" id="modal-retry">
  <div class="modal">
    <h3 class="modal-title">确认重新提交？</h3>
    <p class="modal-body">系统将对该出库单重新执行库存扣减，请确认商品信息和可用库存充足后再操作。</p>
    <div class="modal-foot">
      <button class="neutral-btn" onclick="closeModal()">取消</button>
      <button class="accent-btn" onclick="doRetry()">确认重新提交</button>
    </div>
  </div>
</div>

<script>
/* ─── 模拟数据库 ─── */
const ORDERS = {
  'OUT-20240601-000128': {
    no:'OUT-20240601-000128', type:'销售出库', gen:'APP', src:'SO-2024060112345',
    wh:'1号仓库', status:'已完成', creator:'张三（发货员）',

      {seq:1,barcode:'6901234560001',sku:'SKU-00101',name:'农夫山泉 550ml',spec:'550ml/瓶',unit:'瓶',qty:12,batch:'B2024050101',unfreeze:12,deduct:12,stockStatus:'成功'},
      {seq:2,barcode:'6901234560002',sku:'SKU-00102',name:'可口可乐 330ml',spec:'330ml/罐',unit:'罐',qty:6, batch:'',          unfreeze:6, deduct:6, stockStatus:'成功'},
      {seq:3,barcode:'6901234560004',sku:'SKU-00104',name:'蒙牛纯牛奶 250ml',spec:'250ml/盒',unit:'盒',qty:6,batch:'B2024050201',unfreeze:6, deduct:6, stockStatus:'成功'},
    ],
    flows:[
      {no:'FW-20240601-000256',type:'解冻锁定',sku:'SKU-00101',name:'农夫山泉 550ml',wh:'1号仓库',batch:'B2024050101',qty:-12,op:'张三（发货员）',time:'2024-06-01 09:12'},
      {no:'FW-20240601-000257',type:'扣减实物',sku:'SKU-00101',name:'农夫山泉 550ml',wh:'1号仓库',batch:'B2024050101',qty:-12,op:'系统',time:'2024-06-01 09:12'},
      {no:'FW-20240601-000258',type:'解冻锁定',sku:'SKU-00102',name:'可口可乐 330ml',wh:'1号仓库',batch:'',            qty:-6, op:'张三（发货员）',time:'2024-06-01 09:12'},
      {no:'FW-20240601-000259',type:'扣减实物',sku:'SKU-00102',name:'可口可乐 330ml',wh:'1号仓库',batch:'',            qty:-6, op:'系统',time:'2024-06-01 09:12'},
      {no:'FW-20240601-000260',type:'解冻锁定',sku:'SKU-00104',name:'蒙牛纯牛奶 250ml',wh:'1号仓库',batch:'B2024050201',qty:-6,op:'张三（发货员）',time:'2024-06-01 09:12'},
      {no:'FW-20240601-000261',type:'扣减实物',sku:'SKU-00104',name:'蒙牛纯牛奶 250ml',wh:'1号仓库',batch:'B2024050201',qty:-6,op:'系统',time:'2024-06-01 09:12'},
    ]
  },
  'OUT-20240601-000122': {
    no:'OUT-20240601-000122', type:'销售出库', gen:'APP', src:'SO-2024060112340',
    wh:'2号仓库', status:'出库失败', creator:'系统',

    reason:'SKU-00103「统一方便面」可用库存不足（需 30，剩余 0），库存扣减失败，已回滚全部明细',
    remark:'',

      {seq:1,barcode:'6901234560003',sku:'SKU-00103',name:'统一方便面 红烧牛肉',spec:'103g/包',unit:'包',qty:30,batch:'',unfreeze:0,deduct:0,stockStatus:'失败'},
      {seq:2,barcode:'6901234560002',sku:'SKU-00102',name:'可口可乐 330ml',spec:'330ml/罐',unit:'罐',qty:18,batch:'',unfreeze:0,deduct:0,stockStatus:'失败'},
    ],
    flows:[]
  },
  'OUT-20240601-000124': {
    no:'OUT-20240601-000124', type:'其他出库', gen:'WEB', src:'',
    wh:'3号仓库', status:'草稿', creator:'王五',
    created:'2024-06-01 08:20', submitted:'—',
    reason:'盘点差异补录', remark:'仓管复核后提交',
    items:[
      {seq:1,barcode:'6901234560005',sku:'SKU-00105',name:'卫龙辣条 大刀肉',spec:'100g/袋',unit:'袋',qty:5,batch:'',unfreeze:null,deduct:null,stockStatus:'—'},
    ],
    flows:[]
  },
};

/* ─── 状态映射 ─── */
const STATUS_CLS = {草稿:'pill-default',提交中:'pill-blue',已完成:'pill-green',已取消:'pill-default',出库失败:'pill-red'};
const TYPE_CLS   = {销售出库:'pill-green',调拨出库:'pill-blue',报损出库:'pill-orange',其他出库:'pill-default'};
const STOCK_CLS  = {'成功':'pill-green','失败':'pill-red','—':'pill-default'};

let currentOrder = null;
let activeTab = 'items';

/* ─── 渲染 ─── */
function render(order) {
  const canvas = document.getElementById('canvas');
  const isDraft  = order.status==='草稿';
  const isFail   = order.status==='出库失败';
  const isAPP    = order.gen==='APP';

  canvas.innerHTML = `
    <div class="page-stack">
      <section class="list-surface">

        <!-- 表头 -->
        <div class="surface-head">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <button class="ib-back-btn" onclick="window.location.href='../outbound.html'">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              出库单管理
            </button>
            <div>
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <h1 class="surface-title">${order.no}</h1>
                <span class="pill ${STATUS_CLS[order.status]||'pill-default'} pill-lg">${order.status}</span>
              </div>
              <p class="surface-subtitle">
                <span class="gen-tag"><span class="gen-dot ${isAPP?'app':'web'}"></span>${isAPP?'仓库APP自动生成':'WEB手动新建'}</span>
                &nbsp;·&nbsp; 创建于 ${order.created}
              </p>
            </div>
          </div>
          <div class="detail-actions">
            ${isDraft ? `
              <a class="neutral-btn" href="./outbound-create.html?no=${encodeURIComponent(order.no)}">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                编辑
              </a>
              <button class="danger-btn" onclick="openModal('cancel')">取消出库单</button>
            ` : ''}
            ${isFail ? `<button class="accent-btn" onclick="openModal('retry')">🔄 重新提交</button>` : ''}
            <button class="neutral-btn" onclick="window.print()">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="5" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4 5V3a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.3"/><path d="M4 9h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
              打印
            </button>
          </div>
        </div>

        <!-- 内容区 -->
        <div class="surface-controls">

          ${isDraft ? `
          <div class="alert alert-info">
            <div class="alert-icon">📝</div>
            <div class="alert-body">
              <div class="alert-title">草稿状态</div>
              <div class="alert-text">当前出库单处于草稿状态，提交后将执行库存扣减。草稿中可随时编辑商品明细。</div>
            </div>
          </div>` : ''}

          ${isFail ? `
          <div class="alert alert-fail">
            <div class="alert-icon">❌</div>
            <div class="alert-body">
              <div class="alert-title">出库失败原因</div>
              <div class="alert-text">${order.reason}</div>
            </div>
          </div>` : ''}

          <!-- 基本信息 -->
          <div class="form-section">
            <div class="form-section-title">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="3" stroke="var(--accent)" stroke-width="1.5"/><path d="M5 8h6M5 5.5h6M5 10.5h4" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/></svg>
              基本信息
            </div>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">出库单号</span>
                <span class="info-value mono">${order.no}</span>
              </div>
              <div class="info-item">
                <span class="info-label">出库类型</span>
                <span class="info-value"><span class="pill ${TYPE_CLS[order.type]||'pill-default'}">${order.type}</span></span>
              </div>
              <div class="info-item">
                <span class="info-label">生成方式</span>
                <span class="info-value"><span class="gen-tag"><span class="gen-dot ${isAPP?'app':'web'}"></span>${isAPP?'仓库APP自动生成':'WEB手动新建'}</span></span>
              </div>
              <div class="info-item">
                <span class="info-label">出库状态</span>
                <span class="info-value"><span class="pill ${STATUS_CLS[order.status]||'pill-default'}">${order.status}</span></span>
              </div>
              <div class="info-item">
                <span class="info-label">来源单号</span>
                <span class="info-value">${order.src||'—'}</span>
              </div>
              <div class="info-item">
                <span class="info-label">出库仓库</span>
                <span class="info-value">${order.wh}</span>
              </div>
              <div class="info-item">
                <span class="info-label">创建人 / 发货员</span>
                <span class="info-value">${order.creator}</span>
              </div>
              <div class="info-item">
                <span class="info-label">创建时间</span>
                <span class="info-value">${order.created}</span>
              </div>
              <div class="info-item">
                <span class="info-label">发货 / 提交时间</span>
                <span class="info-value">${order.submitted}</span>
              </div>
              <div class="info-item" style="grid-column:span 3;">
                <span class="info-label">出库原因</span>
                <span class="info-value" style="font-weight:400;color:var(--subtext);">${order.reason||'—'}</span>
              </div>
              <div class="info-item" style="grid-column:span 4;">
                <span class="info-label">备注</span>
                <span class="info-value" style="font-weight:400;color:var(--subtext);">${order.remark||'—'}</span>
              </div>
            </div>
          </div>

          <!-- 明细 & 流水（非草稿） -->
          ${!isDraft ? `
          <div class="form-section">
            <div class="tabs">
              <div class="tab active" id="tab-items" onclick="switchTab('items')">
                出库明细 <span class="tab-count">${order.items.length}</span>
              </div>
              <div class="tab" id="tab-flows" onclick="switchTab('flows')">
                出库流水 <span class="tab-count" style="${order.flows.length?'':'background:rgba(29,29,31,.06);color:var(--muted);'}">${order.flows.length}</span>
              </div>
            </div>

            <!-- 出库明细 -->
            <div class="tab-panel active" id="panel-items">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style="width:40px;text-align:center;">序</th>
                      <th>商品条形码</th><th>SKU编码</th><th>商品名称</th>
                      <th>规格</th><th>单位</th>
                      <th style="text-align:center;">出库数量</th>
                      <th>批次号</th>
                      <th style="text-align:center;">解冻锁定</th>
                      <th style="text-align:center;">实扣实物</th>
                      <th style="text-align:center;">扣减状态</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${order.items.map(r=>`
                    <tr class="${r.stockStatus==='失败'?'row-fail':''}">
                      <td class="td-muted td-center">${r.seq}</td>
                      <td class="td-mono">${r.barcode}</td>
                      <td class="td-mono">${r.sku}</td>
                      <td style="font-weight:600;">${r.name}</td>
                      <td class="td-muted">${r.spec}</td>
                      <td class="td-muted">${r.unit}</td>
                      <td class="td-center" style="font-weight:700;">${r.qty}</td>
                      <td class="td-muted">${r.batch||'—'}</td>
                      <td class="td-center">${r.unfreeze!==null?r.unfreeze:'—'}</td>
                      <td class="td-center">${r.deduct!==null?r.deduct:'—'}</td>
                      <td class="td-center"><span class="pill ${STOCK_CLS[r.stockStatus]||'pill-default'}">${r.stockStatus}</span></td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- 出库流水 -->
            <div class="tab-panel" id="panel-flows">
              ${order.flows.length ? `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>流水号</th>
                      <th style="text-align:center;">流水类型</th>
                      <th>SKU编码</th><th>商品名称</th><th>仓库</th>
                      <th>批次号</th>
                      <th style="text-align:center;">变动数量</th>
                      <th>操作人</th><th>操作时间</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${order.flows.map(f=>`
                    <tr>
                      <td class="td-mono" style="font-size:11px;">${f.no}</td>
                      <td class="td-center">
                        <span class="flow-tag ${f.type==='解冻锁定'?'flow-unfreeze':'flow-deduct'}">${f.type}</span>
                      </td>
                      <td class="td-mono">${f.sku}</td>
                      <td style="font-weight:600;font-size:12px;">${f.name}</td>
                      <td class="td-muted">${f.wh}</td>
                      <td class="td-muted">${f.batch||'—'}</td>
                      <td class="td-center" style="font-weight:700;color:var(--danger);">${f.qty}</td>
                      <td class="td-muted">${f.op}</td>
                      <td class="td-muted">${f.time}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>` : `
              <div style="text-align:center;padding:48px 20px;color:var(--muted);">
                <div style="font-size:32px;margin-bottom:10px;">📊</div>
                <div style="font-size:14px;">暂无出库流水记录</div>
                <div style="font-size:12px;margin-top:4px;">出库单提交成功后将自动生成解冻和扣减流水</div>
              </div>`}
            </div>
          </div>
          ` : `
          <!-- 草稿态：明细待提交提示 -->
          <div class="alert alert-info">
            <div class="alert-icon">ℹ️</div>
            <div class="alert-body">
              <div class="alert-title">草稿状态</div>
              <div class="alert-text">出库明细和流水将在出库单提交成功后生成。当前共 <strong>${order.items.length}</strong> 行商品明细待提交。</div>
            </div>
          </div>
          `}

        </div><!-- /surface-controls -->
      </section>
    </div>
  `;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(`tab-${tab}`)?.classList.add('active');
  document.getElementById(`panel-${tab}`)?.classList.add('active');
}

function openModal(type) {
  document.getElementById(`modal-${type}`).classList.add('show');
}
function closeModal() {
  document.querySelectorAll('.modal-mask').forEach(m=>m.classList.remove('show'));
}
function doCancel() {
  closeModal();
  if (currentOrder) currentOrder.status='已取消';
  render(currentOrder);
}
function doRetry() {
  closeModal();
  alert('已重新提交，系统将重新执行库存扣减\n（原型演示）');
}

document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModal(); }));

/* ─── 入口：读取URL参数 ─── */
const params = new URLSearchParams(window.location.search);
const no = params.get('no') || 'OUT-20240601-000128';
currentOrder = ORDERS[no] || ORDERS['OUT-20240601-000128'];
const urlStatus = params.get('status');
if (urlStatus && currentOrder) currentOrder = {...currentOrder, status:urlStatus};

render(currentOrder);
document.title = `${currentOrder.no} · 出库单详情`;

// 通知父级 shell 高亮出库管理菜单
try { window.parent.postMessage({type:'wms-content-ready',pageKey:'outbound'},'*'); } catch(e) {}
</script>
</body>
</html>
